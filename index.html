            const activeMissionIndex = completedBlocks.length;
            
            return (
                <div className="flex flex-col items-center justify-center h-full w-full max-w-[1400px] mx-auto p-4 md:p-12 pop-in relative z-20">
                    <h1 className="text-4xl md:text-8xl font-black text-white mb-2 md:mb-4 uppercase neon-text text-center tracking-wide drop-shadow-[0_0_30px_rgba(255,255,255,0.4)]">
                        Estación Espacial
                    </h1>
                    <p className="text-xl md:text-4xl text-[var(--brand-yellow)] mb-6 md:mb-12 font-black text-center drop-shadow-md px-4">
                        ¡Elige tu próxima misión matemática, cadete!
                    </p>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-8 w-full px-4">
                        {blockNames.map((block, index) => {
                            const isCompleted = index < activeMissionIndex;
                            const isActive = index === activeMissionIndex;
                            const isLocked = index > activeMissionIndex;
                            
                            let stateClass = '';
                            let cursorClass = '';
                            
                            if (isCompleted) {
                                stateClass = 'bg-slate-900 border-slate-700 opacity-70';
                                cursorClass = 'cursor-not-allowed';
                            } else if (isActive) {
                                stateClass = 'bg-gradient-to-br from-slate-800 to-slate-900 border-[var(--brand-green)] shadow-[0_10px_20px_rgba(0,255,102,0.2)] md:hover:scale-105 hover:shadow-[0_15px_40px_rgba(0,255,102,0.4)] animate-pulse';
                                cursorClass = 'cursor-pointer';
                            } else if (isLocked) {
                                stateClass = 'bg-slate-900/50 border-slate-800 opacity-50 grayscale';
                                cursorClass = 'cursor-not-allowed';
                            }

                            return (
                                <button key={index} 
                                    onClick={() => { if(isActive) onSelectBlock(index); }}
                                    className={`relative flex flex-col items-center justify-center p-6 md:p-8 rounded-3xl md:rounded-[3rem] border-2 md:border-4 transition-all duration-300 shadow-2xl overflow-hidden min-h-[160px] md:min-h-[220px] group ${stateClass} ${cursorClass}`}
                                >
                                    {isCompleted && <div className="absolute top-4 right-4 md:top-6 md:right-6 bg-slate-700 text-[var(--brand-green)] rounded-full p-1 md:p-2 shadow-inner"><Check size={24} className="md:w-8 md:h-8 fill-none" strokeWidth={4} /></div>}
                                    {isLocked && <div className="absolute top-4 right-4 md:top-6 md:right-6 bg-slate-800 text-slate-500 rounded-full p-1 md:p-2"><Lock size={24} className="md:w-8 md:h-8 fill-none" strokeWidth={3} /></div>}
                                    
                                    <div className="text-5xl md:text-7xl mb-2 md:mb-4 group-hover:scale-110 transition-transform drop-shadow-lg">{block.icon}</div>
                                    <div className={`text-xl md:text-3xl font-black mb-1 md:mb-2 uppercase tracking-widest ${isActive ? 'text-[var(--brand-green)]' : 'text-slate-500'}`}>Misión 0{index + 1}</div>
                                    <h3 className={`text-lg md:text-2xl font-bold text-center leading-tight px-2 md:px-4 ${isActive ? 'text-white' : 'text-slate-400'}`}>{block.title}</h3>
                                    
                                    {isActive && (
                                        <div className="absolute bottom-4 bg-[var(--brand-green)] text-slate-900 text-xs md:text-sm font-black px-4 py-1 rounded-full uppercase tracking-widest shadow-[0_0_10px_var(--brand-green)]">Misión Actual</div>
                                    )}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const FinaleScreen = ({ score, onRestart }) => {
            return (
                <div className="flex flex-col items-center justify-center min-h-[80vh] w-full max-w-4xl mx-auto p-4 md:p-12 pop-in relative z-20">
                    <Confetti />
                    <div className="glass-panel p-8 md:p-16 rounded-[3rem] md:rounded-[4rem] border-4 md:border-8 border-[var(--brand-yellow)] shadow-[0_0_60px_rgba(255,234,0,0.5)] flex flex-col items-center text-center bg-gradient-to-b from-slate-900 to-slate-800 w-full">
                        <Star size={80} className="text-[var(--brand-yellow)] fill-[var(--brand-yellow)] animate-pulse mb-6 drop-shadow-[0_0_20px_rgba(255,234,0,0.8)]" />
                        <h1 className="text-4xl md:text-7xl font-black text-white mb-4 uppercase tracking-widest neon-text drop-shadow-md">
                            ¡Misiones<br/>Completadas!
                        </h1>
                        <p className="text-xl md:text-3xl text-slate-300 font-bold mb-8">
                            Has superado todos los retos de la Estación Espacial.
                        </p>
                        
                        <div className="bg-slate-900 border-4 border-white/20 rounded-3xl p-6 md:p-10 mb-10 w-full max-w-md shadow-inner flex flex-col items-center">
                            <span className="text-lg md:text-2xl text-slate-400 font-bold uppercase tracking-widest mb-2">Puntaje Total Final</span>
                            <span className="text-6xl md:text-8xl font-black text-[var(--brand-green)] drop-shadow-[0_0_15px_rgba(0,255,102,0.8)]">{score}</span>
                        </div>

                        <Button onClick={onRestart} variant="primary" className="text-2xl md:text-4xl px-10 py-5 w-full md:w-auto border-2 border-white">
                            Jugar de Nuevo <Rocket size={32} className="ml-2" />
                        </Button>
                    </div>
                </div>
            );
        };

        function TuProfe20LabV2() {
            const [view, setView] = useState('start');
            const [currentBlock, setCurrentBlock] = useState(0);
            const [currentLevel, setCurrentLevel] = useState(0);
            const [completedBlocks, setCompletedBlocks] = useState([]);
            const [levelScores, setLevelScores] = useState({});
            
            const [mistakes, setMistakes] = useState(0);

            const [showWarning, setShowWarning] = useState(""); 
            const [showError, setShowError] = useState(""); 
            const [showSuccess, setShowSuccess] = useState(""); 
            const [showMissionComplete, setShowMissionComplete] = useState(false);
            
            const [soundOn, setSoundOn] = useState(() => localStorage.getItem('tuprofe20-sound') !== 'off');
            
            const playClick = useSound('click');
            const playSuccess = useSound('success');
            const playError = useSound('wrong');
            const playWin = useSound('win');

            const calculateScore = () => {
                let score = 0;
                Object.values(levelScores).forEach(blockScores => {
                    Object.values(blockScores).forEach(pts => {
                        score += pts;
                    });
                });
                return Math.max(0, score);
            };

            useEffect(() => {
                const savedBlocks = localStorage.getItem('tuprofe20-blocks');
                const savedScores = localStorage.getItem('tuprofe20-scores');
                if (savedBlocks) { try { setCompletedBlocks(JSON.parse(savedBlocks)); } catch (_) {} }
                if (savedScores) { try { setLevelScores(JSON.parse(savedScores)); } catch (_) {} }
            }, []);
            
            useEffect(() => { soundEnabled = soundOn; localStorage.setItem('tuprofe20-sound', soundOn ? 'on' : 'off'); }, [soundOn]);
            
            useEffect(() => { 
                localStorage.setItem('tuprofe20-blocks', JSON.stringify(completedBlocks)); 
                localStorage.setItem('tuprofe20-scores', JSON.stringify(levelScores));
            }, [completedBlocks, levelScores]);
            
            useEffect(() => {
                const onKey = (event) => { if (event.key === 'Escape' && view === 'playing') setView('hub'); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [view]);

            // Comprobar si todas las misiones están completadas para mostrar el Finale directamente
            useEffect(() => {
                if (view === 'hub' && completedBlocks.length >= missionsData.length) {
                    setView('finale');
                }
            }, [completedBlocks, view]);

            const advanceLevelRef = useRef();
            advanceLevelRef.current = () => {
                const totalInBlock = missionsData[currentBlock].length;
                setMistakes(0); 
                
                if (currentLevel + 1 < totalInBlock) {
                    setCurrentLevel(prev => prev + 1);
                } else {
                    if (!completedBlocks.includes(currentBlock)) {
                        setCompletedBlocks(cb => [...cb, currentBlock]);
                    }
                    setShowMissionComplete(true);
                }
            };

            useEffect(() => {
                if (showMissionComplete) {
                    playWin();
                    const timer = setTimeout(() => {
                        setShowMissionComplete(false);
                        
                        if (currentBlock === missionsData.length - 1) {
                            setView('finale');
                        } else {
                            setView('hub'); 
                        }
                    }, 2500);
                    return () => clearTimeout(timer);
                }
            }, [showMissionComplete]);

            const handleStart = () => { 
                playClick(); 
                if (completedBlocks.length >= missionsData.length) {
                    setView('finale');
                } else {
                    setView('hub'); 
                }
            };
            
            const handleSelectBlock = (blockIndex) => { 
                playClick(); 
                setCurrentBlock(blockIndex); 
                
                setMistakes(0);
                setCurrentLevel(0); 
                setLevelScores(prev => {
                    const newScores = { ...prev };
                    delete newScores[blockIndex]; 
                    return newScores;
                });

                setView('playing'); 
            };
            
            const handleSuccess = () => {
                playSuccess();
                const earnedPoints = mistakes === 0 ? 20 : 10;
                setShowSuccess(`¡Excelente! (+${earnedPoints} pts)`);
                
                setLevelScores(prev => ({
                    ...prev,
                    [currentBlock]: {
                        ...(prev[currentBlock] || {}),
                        [currentLevel]: earnedPoints
                    }
                }));

                setTimeout(() => {
                    setShowSuccess("");
                    advanceLevelRef.current();
                }, 2000);
            };
            
            const handleError = (msg, isMistake = true) => { 
                if (!isMistake) {
                    setShowWarning(msg);
                    setTimeout(() => setShowWarning(""), 2000);
                    return;
                }

                playError(); 
                
                const newMistakes = mistakes + 1;
                setMistakes(newMistakes);

                if (newMistakes >= 2) {
                    setShowError("¡Intentos Agotados! Obtienes 0 puntos. " + msg);
                    setLevelScores(prev => ({
                        ...prev,
                        [currentBlock]: {
                            ...(prev[currentBlock] || {}),
                            [currentLevel]: 0 
                        }
                    }));
                    setTimeout(() => {
                        setShowError("");
                        advanceLevelRef.current();
                    }, 2500);
                } else {
                    setShowError("¡Fallaste! Pierdes 10 puntos (Te queda 1 intento). " + msg);
                    setTimeout(() => {
                        setShowError("");
                    }, 2500);
                }
            };

            const handleRestart = () => {
                playClick();
                setCompletedBlocks([]);
                setLevelScores({});
                setCurrentBlock(0);
                setCurrentLevel(0);
                setView('start');
            };

            const renderCurrentActivity = () => {
                const mission = missionsData[currentBlock][currentLevel];
                const props = { data: mission, onComplete: handleSuccess, onError: handleError };

                switch (mission.type) {
                    case 'number_line_interactive': return <ActNumberLineInteractive key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'visual': return <ActVisualEquivalence key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'paint': return <ActPaintEquivalence key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'operation': return <ActOperation key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'missing_term': return <ActMissingTerm key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'word_problem': return <ActWordProblem key={`${currentBlock}-${currentLevel}`} {...props} />;
                    default: return <div>Cargando...</div>;
                }
            };

            return (
                <div className="app-container">
                    <DynamicBackground />
                    
                    {view !== 'start' && (
                        <div className="min-h-[4.5rem] bg-slate-900/90 backdrop-blur-xl border-b-2 border-white/20 px-2 md:px-12 py-2 md:py-4 flex flex-wrap items-center justify-between gap-2 md:gap-4 shadow-[0_10px_30px_rgba(0,0,0,0.5)] z-50 w-full relative">
                            <div className="flex items-center gap-2 md:gap-6 w-full md:w-auto justify-between md:justify-start">
                                <div className="flex items-center gap-2 md:gap-4">
                                    {view === 'playing' && (
                                        <button onClick={() => {playClick(); setView('hub');}} className="w-10 h-10 md:w-16 md:h-16 bg-gradient-to-br from-slate-700 to-slate-800 hover:from-[var(--brand-primary)] hover:to-[var(--brand-tertiary)] border-2 border-slate-500 hover:border-white rounded-lg md:rounded-2xl flex items-center justify-center transition-all bouncy-hover text-white shadow-lg shrink-0">
                                            <ArrowLeft size={24} strokeWidth={3} className="md:w-9 md:h-9" />
                                        </button>
                                    )}
                                    <div className="font-black text-white uppercase tracking-widest text-sm md:text-lg drop-shadow-lg flex flex-col justify-center">
                                        {view === 'hub' ? "Menú Principal" : (view === 'finale' ? "Aventura Superada" : `Misión 0${currentBlock + 1}`)}
                                        {view === 'playing' && (
                                            <div className="flex gap-1 md:gap-2 mt-1 md:mt-2 overflow-x-auto no-scrollbar pb-1 pointer-events-none">
                                                {missionsData[currentBlock].map((_, i) => {
                                                    const isCurrent = currentLevel === i;
                                                    const score = levelScores[currentBlock]?.[i];
                                                    let bgClass = "bg-slate-700 border-slate-500 text-slate-400";
                                                    
                                                    if (isCurrent) bgClass = "bg-[var(--brand-primary)] border-white text-white shadow-[0_0_10px_var(--brand-primary)] scale-110";
                                                    else if (score > 0) bgClass = "bg-[var(--brand-green)] border-[var(--brand-green)] text-slate-900";
                                                    else if (score === 0) bgClass = "bg-[var(--brand-primary)] border-[var(--brand-primary)] text-white";
                                                    
                                                    return (
                                                        <div key={i} className={`w-6 h-6 md:w-10 md:h-10 rounded-full border-2 font-black text-xs md:text-lg transition-all flex items-center justify-center shrink-0 ${bgClass}`}>
                                                            {i + 1}
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>
                                
                                <div className="flex md:hidden items-center gap-2">
                                    <button type="button" onClick={() => { playClick(); setSoundOn(v => !v); }} className="w-10 h-10 rounded-lg display-grid place-items-center bg-slate-800 border-2 border-white/20 text-xl" aria-label={soundOn ? 'Silenciar sonidos' : 'Activar sonidos'}>{soundOn ? '🔊' : '🔇'}</button>
                                </div>
                            </div>
                            
                            <div className="hidden md:flex items-center gap-4 md:gap-6">
                                <button type="button" onClick={() => { playClick(); setSoundOn(v => !v); }} className="icon-button bouncy-hover text-3xl shadow-lg bg-slate-800" aria-label={soundOn ? 'Silenciar sonidos' : 'Activar sonidos'} title={soundOn ? 'Silenciar' : 'Activar sonido'}>{soundOn ? '🔊' : '🔇'}</button>
                                <div className="flex items-center gap-2 md:gap-4 bg-gradient-to-r from-slate-900 to-slate-800 px-4 md:px-6 py-2 md:py-3 rounded-full border-2 md:border-4 border-[var(--brand-yellow)] shadow-[0_0_20px_rgba(255,234,0,0.4)]">
                                    <Star size={24} className="md:w-10 md:h-10 text-[var(--brand-yellow)] fill-[var(--brand-yellow)] animate-pulse drop-shadow-[0_0_10px_rgba(255,234,0,0.8)]" />
                                    <span className="font-black text-[var(--brand-yellow)] text-lg md:text-4xl drop-shadow-md">{calculateScore()} PTS</span>
                                </div>
                            </div>

                            <div className="flex md:hidden w-full items-center justify-center mt-2 border-t border-white/10 pt-2">
                                <div className="flex items-center gap-2">
                                    <Star size={20} className="text-[var(--brand-yellow)] fill-[var(--brand-yellow)] animate-pulse" />
                                    <span className="font-black text-[var(--brand-yellow)] text-lg drop-shadow-md">{calculateScore()} PTS</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {showWarning && (
                        <div className="absolute top-32 left-1/2 -translate-x-1/2 bg-gradient-to-r from-[var(--brand-orange)] to-[#cc4400] text-white w-11/12 md:w-auto px-6 py-4 md:px-12 md:py-6 rounded-2xl md:rounded-3xl font-black text-lg md:text-2xl shadow-[0_20px_60px_rgba(255,85,0,0.9)] z-[300] flex flex-col md:flex-row items-center justify-center gap-4 pop-in border-2 md:border-4 border-white text-center">
                            <AlertCircle size={40} className="shrink-0 animate-pulse md:w-[40px] md:h-[40px]" strokeWidth={3} />
                            {showWarning}
                        </div>
                    )}

                    {showError && (
                        <div className="absolute inset-0 bg-[#0B0E14]/80 backdrop-blur-sm z-[300] flex items-center justify-center p-4 pop-in">
                            <div className="bg-slate-900 p-8 md:p-12 rounded-[2rem] border-4 border-[var(--brand-primary)] shadow-[0_0_50px_rgba(255,0,122,0.6)] flex flex-col items-center text-center max-w-xl w-full relative">
                                <div className="w-16 h-16 md:w-20 md:h-20 bg-[var(--brand-primary)] rounded-full flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(255,0,122,0.8)]">
                                    <AlertCircle size={40} className="text-white md:w-[50px] md:h-[50px]" strokeWidth={3} />
                                </div>
                                <h3 className="text-2xl md:text-4xl font-black text-white mb-4">
                                    {mistakes >= 2 ? "¡Intentos Agotados!" : "¡Casi lo logras!"}
                                </h3>
                                <p className="text-lg md:text-2xl text-slate-300 font-bold mb-6 leading-relaxed">
                                    {showError}
                                </p>
                                <div className="bg-[var(--brand-primary)]/20 text-[var(--brand-primary)] font-black text-xl px-6 py-2 rounded-full border border-[var(--brand-primary)] animate-pulse mb-4">
                                    {mistakes >= 2 ? "¡Te llevas 0 puntos en este nivel!" : "¡Piensa un poco más y vuelve a intentarlo!"}
                                </div>
                                <p className="text-slate-400 mt-2 font-bold animate-pulse">
                                    {mistakes >= 2 ? "Avanzando al siguiente ejercicio..." : "Intenta de nuevo en un momento..."}
                                </p>
                            </div>
                        </div>
                    )}

                    {showSuccess && (
                        <div className="absolute inset-0 bg-[#0B0E14]/80 backdrop-blur-sm z-[300] flex items-center justify-center p-4 pop-in">
                            <Confetti />
                            <div className="bg-slate-900 p-8 md:p-12 rounded-[2rem] border-4 border-[#00FF66] shadow-[0_0_50px_rgba(0,255,102,0.6)] flex flex-col items-center text-center max-w-xl w-full relative">
                                <div className="w-16 h-16 md:w-20 md:h-20 bg-[#00FF66] rounded-full flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(0,255,102,0.8)]">
                                    <Check size={40} className="text-slate-900 md:w-[50px] md:h-[50px]" strokeWidth={4} />
                                </div>
                                <h3 className="text-2xl md:text-4xl font-black text-white mb-6">{showSuccess}</h3>
                                <div className="bg-[#FFEA00] text-slate-900 font-black text-xl px-6 py-2 rounded-full shadow-[0_0_15px_rgba(255,234,0,0.5)] mb-4">
                                    ¡BIEN HECHO!
                                </div>
                                <p className="text-[#00FF66] mt-2 font-bold animate-pulse">Avanzando...</p>
                            </div>
                        </div>
                    )}

                    {showMissionComplete && (
                        <div className="absolute inset-0 bg-[#0B0E14]/80 backdrop-blur-sm z-[400] flex items-center justify-center pop-in p-4">
                            <Confetti />
                            <div className="bg-[#1a1f2e] px-8 py-10 md:px-16 md:py-16 rounded-[2rem] md:rounded-[3rem] shadow-[0_0_40px_rgba(0,255,102,0.3)] flex flex-col items-center text-center max-w-md w-full border-4 border-[#00FF66] relative">
                                <div className="w-24 h-24 md:w-32 md:h-32 rounded-full flex items-center justify-center mb-6 border-[4px] border-[#00FF66] bg-transparent shadow-[0_0_20px_rgba(0,255,102,0.3),inset_0_0_20px_rgba(0,255,102,0.3)]">
                                    <Check size={50} strokeWidth={4} className="text-[#00FF66] drop-shadow-[0_0_10px_rgba(0,255,102,0.8)] md:w-16 md:h-16" />
                                </div>
                                <h2 className="text-4xl md:text-5xl font-black text-white mb-2 drop-shadow-md">¡Misión Superada!</h2>
                                <p className="text-xl md:text-2xl text-[#00FF66] font-bold mb-6">¡Completaste todos los retos de este nivel!</p>
                                <p className="text-slate-400 font-bold animate-pulse">Volviendo al menú en un momento...</p>
                            </div>
                        </div>
                    )}

                    <div className="flex-grow relative overflow-y-auto md:overflow-hidden flex items-center justify-center w-full z-10 p-2 md:p-0">
                        {view === 'start' && (
                            <div className="flex flex-col lg:flex-row items-center justify-center gap-8 md:gap-12 lg:gap-24 glass-panel p-6 md:p-16 lg:p-24 rounded-[3rem] md:rounded-[4rem] lg:rounded-[5rem] border-4 border-white/20 shadow-[0_0_120px_rgba(0,0,0,0.8)] pop-in w-full max-w-[1400px] h-auto min-h-[75vh] my-4 md:my-6 bg-gradient-to-br from-slate-900/90 to-slate-800/90">
                                
                                <div className="flex flex-col items-center justify-center relative wiggle mt-8 md:mt-0">
                                    <AnimatedRobot size={240} className="md:w-[320px] md:h-[320px] drop-shadow-[0_0_60px_rgba(0,240,255,0.8)] z-10" />
                                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] md:w-[500px] md:h-[500px] bg-gradient-to-r from-[var(--brand-secondary)] to-[var(--brand-tertiary)] rounded-full blur-[60px] md:blur-[100px] opacity-30 -z-10"></div>
                                </div>

                                <div className="flex flex-col items-center justify-center lg:border-l-4 border-white/20 lg:pl-24 text-center mt-4 md:mt-0">
                                    <h1 className="text-5xl md:text-8xl lg:text-[110px] font-black text-white leading-tight tracking-tighter neon-text uppercase text-center drop-shadow-[0_0_20px_rgba(255,0,122,0.8)]">
                                        TuProfe20<br/>
                                        <span className="text-[var(--brand-secondary)] text-5xl md:text-9xl lg:text-[130px] drop-shadow-[0_0_40px_rgba(0,240,255,0.8)] mt-2 block md:inline">Lab</span>
                                    </h1>
                                    
                                    <div className="bg-gradient-to-r from-[var(--brand-yellow)] to-[#ffaa00] border-2 md:border-4 border-white rounded-xl md:rounded-[2rem] px-8 py-4 md:px-16 md:py-6 mt-8 md:mt-10 mb-8 md:mb-14 shadow-[0_0_40px_rgba(255,234,0,0.6)] transform -rotate-3 hover:rotate-0 transition-transform">
                                        <p className="text-xl md:text-5xl font-black text-slate-900 tracking-widest uppercase m-0 drop-shadow-sm text-center leading-tight">
                                            Aventura de Fracciones
                                        </p>
                                    </div>
                                    
                                    <Button onClick={handleStart} variant="primary" className="text-3xl md:text-6xl px-12 py-6 md:px-24 md:py-10 shadow-[0_0_80px_rgba(255,0,122,0.8)] group border-2 md:border-4 border-white w-full md:w-auto mb-8 md:mb-0">
                                        ¡INICIAR! <Rocket size={40} className="md:w-[60px] md:h-[60px] group-hover:translate-x-4 group-hover:-translate-y-4 transition-transform" />
                                    </Button>
                                </div>
                            </div>
                        )}
                        
                        {view === 'hub' && <MissionHub onSelectBlock={handleSelectBlock} completedBlocks={completedBlocks} />}
                        {view === 'playing' && renderCurrentActivity()}
                        {view === 'finale' && <FinaleScreen score={calculateScore()} onRestart={handleRestart} />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TuProfe20LabV2 />);
    </script>
</body>
</html>
