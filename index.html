<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuProfe20 Lab - Fracciones e Igualdades</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-primary: #FF007A;
            --brand-secondary: #00F0FF;
            --brand-tertiary: #7000FF;
            --brand-yellow: #FFE600;
            --brand-green: #00FF66;
            --brand-orange: #FF6B00;
            --brand-bg: #090A0F;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--brand-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* FONDO ESPACIAL: VÍA LÁCTEA SUTIL Y LIMPIA */
        .space-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            overflow: hidden;
        }
        
        .milky-way {
            position: absolute;
            width: 200vw; height: 200vh; top: -50vh; left: -50vw;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #dddddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #dddddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            animation: rotateMilkyWay 400s linear infinite;
            opacity: 0.3;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle linear infinite alternate;
        }

        @keyframes rotateMilkyWay { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes twinkle { 0% { opacity: 0.1; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px #fff; } }

        /* Ocultar input number spinner */
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .app-container { font-family: 'Nunito', sans-serif; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .bouncy-hover { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bouncy-hover:hover { transform: translateY(-5px) scale(1.05); }
        .bouncy-hover:active { transform: translateY(2px) scale(0.95); }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
        }
        
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .float-anim { animation: floating 3s ease-in-out infinite; }
        .pulse-glow { animation: pulseGlow 1.5s infinite; }
        .wiggle { animation: wiggle 3s ease-in-out infinite; }
        .neon-text { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 10px #fff; transform: scale(1.05); border-color: #fff; } 50% { box-shadow: 0 0 30px #fff; transform: scale(1.1); border-color: var(--brand-secondary); } }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg) translateY(0); } 25% { transform: rotate(-3deg) translateY(-10px); } 75% { transform: rotate(3deg) translateY(5px); } }

        /* LAYOUT HORIZONTAL CENTRADO ABSOLUTO */
        .horizontal-layout { display: flex; flex-direction: row; align-items: center; justify-content: center; width: 100%; max-width: 1400px; height: 100%; padding: 2rem; gap: 4rem; margin: 0 auto; }
        .robot-pane { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        .interaction-pane { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; flex: 1; }

        /* Drag & Drop */
        .draggable-item { cursor: pointer; transition: all 0.3s ease; user-select: none; }
        .draggable-item:hover { transform: scale(1.1) translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .dropzone { border: 4px dashed rgba(255,255,255,0.3); transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(0,0,0,0.2); }
        .dropzone.active { border-color: var(--brand-green); background: rgba(0, 255, 102, 0.1); animation: pulseGlow 1.5s infinite; }
        .dropzone.filled { border-style: solid; border-color: var(--brand-secondary); background: rgba(15, 23, 42, 0.8); }

        .balance-beam { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .confetti-piece { position: absolute; width: 12px; height: 24px; opacity: 0; animation: fall linear forwards; }
        @keyframes fall { 0% { opacity: 1; top: -10%; transform: rotate(0deg); } 100% { opacity: 0; top: 110%; transform: rotate(720deg); } }

        /* Scroll oculto para bloques */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        button:focus-visible, [role="button"]:focus-visible, input:focus-visible { outline: 4px solid var(--brand-yellow); outline-offset: 4px; }
        .progress-track { height: 10px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--brand-primary), var(--brand-yellow)); transition: width .45s ease; box-shadow: 0 0 16px var(--brand-primary); }
        .icon-button { width: 3.5rem; height: 3.5rem; border-radius: 1rem; display: grid; place-items: center; background: rgba(30,41,59,.9); border: 2px solid rgba(255,255,255,.18); }
        @media (max-width: 900px) {
            body { overflow: auto; }
            .app-container { min-height: 100dvh; height: auto; }
            .horizontal-layout { flex-direction: column; height: auto; min-height: 100%; padding: 1rem; gap: 1.25rem; overflow-y: auto; }
            .robot-pane { width: 100%; max-width: 560px; }
            .robot-pane svg { width: 86px; height: 86px; }
            .interaction-pane { width: 100%; gap: 1rem; }
            .interaction-pane > * { min-width: 0 !important; width: 100% !important; padding: 1.25rem !important; border-radius: 2rem !important; }
            .glass-panel { backdrop-filter: blur(14px); }
            .bouncy-hover:hover { transform: none; }
        }
        @media (max-width: 640px) {
            .horizontal-layout { padding: .75rem; }
            .robot-pane .glass-panel { font-size: 1rem !important; padding: 1rem !important; }
            .dropzone { max-width: 100%; }
            h1 { overflow-wrap: anywhere; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Play = (p) => <IconBase {...p}><polygon points="5 3 19 12 5 21 5 3"/></IconBase>;
        const Star = (p) => <IconBase {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const AlertCircle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>;
        const Check = (p) => <IconBase {...p}><polyline points="20 6 9 17 4 12"/></IconBase>;
        const ArrowLeft = (p) => <IconBase {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconBase>;
        const Info = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></IconBase>;

        const audioCtx = typeof window !== 'undefined' ? new (window.AudioContext || window.webkitAudioContext)() : null;
        const playTone = (freq, type, duration, vol = 0.1, sweep = false) => {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                if (sweep) {
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(freq / 2, audioCtx.currentTime + duration);
                } else {
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                }
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        };

        let soundEnabled = true;
        const soundLibrary = {
            pop: () => playTone(800, 'sine', 0.15, 0.2, true),
            click: () => playTone(600, 'triangle', 0.05, 0.1),
            place: () => playTone(1200, 'sine', 0.1, 0.1),
            success: () => { playTone(523.25, 'sine', 0.15, 0.2); setTimeout(() => playTone(659.25, 'sine', 0.15, 0.2), 100); setTimeout(() => playTone(783.99, 'sine', 0.3, 0.2), 200); },
            wrong: () => { playTone(200, 'sawtooth', 0.3, 0.2, true); setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.2, true), 150); },
            win: () => { [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.3, 0.2), i * 150)); }
        };
        const useSound = (soundKey) => useCallback(() => { if (soundEnabled && soundLibrary[soundKey]) soundLibrary[soundKey](); }, [soundKey]);

        // Componentes Generales: Fondo Galáctico Limpio
        const DynamicBackground = () => {
            const [stars, setStars] = useState([]);
            useEffect(() => {
                const s = Array.from({length: 150}).map((_, i) => ({
                    id: i, left: `${Math.random() * 100}vw`, top: `${Math.random() * 100}vh`,
                    size: `${Math.random() * 3 + 1}px`, animDuration: `${2 + Math.random() * 5}s`, animDelay: `-${Math.random() * 5}s`
                }));
                setStars(s);
            }, []);
            return (
                <div className="space-bg">
                    <div className="milky-way"></div>
                    {stars.map(s => <div key={`s-${s.id}`} className="star" style={{left: s.left, top: s.top, width: s.size, height: s.size, animationDuration: s.animDuration, animationDelay: s.animDelay}}></div>)}
                </div>
            );
        };

        const AnimatedRobot = ({ size = 100, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 100 100" className={`overflow-visible float-anim ${className}`} xmlns="http://www.w3.org/2000/svg">
                <line x1="50" y1="25" x2="50" y2="10" stroke="#94A3B8" strokeWidth="4" strokeLinecap="round" />
                <circle cx="50" cy="8" r="5" fill="var(--brand-primary)" className="animate-pulse" />
                <rect x="15" y="25" width="70" height="55" rx="20" fill="#1E293B" stroke="var(--brand-secondary)" strokeWidth="4" filter="drop-shadow(0 0 10px var(--brand-secondary))" />
                <rect x="25" y="32" width="50" height="35" rx="12" fill="#0F172A" />
                <circle cx="37" cy="45" r="6" fill="var(--brand-yellow)" />
                <circle cx="63" cy="45" r="6" fill="var(--brand-yellow)" />
                <path d="M 42 56 Q 50 62 58 56" stroke="var(--brand-green)" strokeWidth="3" fill="none" strokeLinecap="round" />
            </svg>
        );

        const RobotGuide = ({ text, children }) => (
            <div className="flex flex-col items-center gap-6 w-full relative">
                <div className="relative bg-slate-900/80 backdrop-blur-md p-4 rounded-[3rem] border-4 border-[var(--brand-secondary)] shadow-[0_0_30px_rgba(0,240,255,0.4)]">
                    <AnimatedRobot size={150} />
                </div>
                <div className="glass-panel text-white p-6 rounded-3xl rounded-tl-none border-t-4 border-[var(--brand-tertiary)] font-bold text-xl relative pop-in text-center leading-relaxed w-full shadow-2xl flex flex-col items-center gap-4">
                    {text}
                    {children}
                    <div className="absolute -top-4 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[12px] border-l-transparent border-b-[18px] border-b-[var(--brand-tertiary)] border-r-[12px] border-r-transparent"></div>
                </div>
            </div>
        );

        const Button = ({ children, onClick, variant = 'primary', className = '' }) => {
            const playClick = useSound('click');
            const variants = { primary: "bg-gradient-to-r from-[var(--brand-primary)] to-[#ff4d94] shadow-[0_6px_0_0_#990049] hover:brightness-110 text-white border-none", secondary: "bg-gradient-to-r from-[var(--brand-secondary)] to-[#66f5ff] shadow-[0_6px_0_0_#009999] hover:brightness-110 text-slate-900" };
            return <button type="button" onClick={(e) => { playClick(); if(onClick) onClick(e); }} className={`bouncy-hover font-black py-4 px-10 rounded-full text-2xl transition-all flex items-center justify-center gap-3 uppercase tracking-wider border-2 border-white/20 ${variants[variant]} ${className}`}>{children}</button>;
        };

        const FractionDisplay = ({ num, den }) => (
            <div className="flex flex-col items-center justify-center font-black text-white">
                <span className="text-6xl border-b-4 border-white pb-1 px-4">{num}</span>
                <span className="text-6xl pt-1 px-4">{den}</span>
            </div>
        );

        const FractionGraphic = ({ n, d, theme = 'default' }) => {
            const wholes = Math.ceil(n / d) || 1;
            const getThemeColors = () => {
                if(theme === 'chocolate') return { bg: 'bg-[#3E2723]', fill: 'bg-[#5D4037]', border: 'border-[#1b100e]' };
                if(theme === 'pizza') return { bg: 'bg-orange-200', fill: 'bg-yellow-400', border: 'border-orange-500' };
                return { bg: 'bg-slate-800', fill: 'bg-[var(--brand-secondary)]', border: 'border-slate-500' };
            };
            const colors = getThemeColors();

            return (
                <div className="flex flex-wrap gap-4 justify-center items-center">
                    {Array.from({length: wholes}).map((_, wIdx) => (
                        <div key={wIdx} className={`flex border-4 ${colors.border} rounded-xl overflow-hidden ${colors.bg} shadow-lg`}>
                            {Array.from({length: d}).map((_, dIdx) => {
                                const isShaded = (wIdx * d) + dIdx < n;
                                return <div key={dIdx} className={`w-8 h-12 border-r-2 ${colors.border} last:border-r-0 ${isShaded ? colors.fill : ''}`}></div>;
                            })}
                        </div>
                    ))}
                </div>
            );
        };

        const Confetti = () => {
            const [pieces, setPieces] = useState([]);
            useEffect(() => {
                const colors = ['#FF007A', '#00F0FF', '#FFE600', '#7000FF', '#00FF66'];
                setPieces(Array.from({ length: 80 }).map((_, i) => ({ id: i, left: `${Math.random() * 100}%`, animationDuration: `${Math.random() * 2 + 1}s`, animationDelay: `${Math.random() * 0.5}s`, backgroundColor: colors[Math.floor(Math.random() * colors.length)], transform: `rotate(${Math.random() * 360}deg)` })));
            }, []);
            return <div className="absolute inset-0 overflow-hidden pointer-events-none z-[100]">{pieces.map(p => <div key={p.id} className="confetti-piece rounded-sm" style={p} />)}</div>;
        };


        // --- BLOQUE 1: Clasificar con Gráficos y Etiquetas ---
        const ActClassifyGraphic = ({ data, onComplete, onError }) => {
            const [selected, setSelected] = useState(null);
            const [placed, setPlaced] = useState(null);
            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const handleSelect = (sym) => { playPop(); setSelected(sym); };
            const handleDrop = () => { if (selected) { playPlace(); setPlaced(selected); setSelected(null); } };
            const handleRemove = (e) => { e.stopPropagation(); playPop(); setPlaced(null); };

            const check = () => {
                if (!placed) { onError("Arrastra una etiqueta a la caja punteada."); return; }
                if (placed === data.correct) onComplete();
                else onError(data.correct === "Propia" ? "Fíjate en el gráfico. No alcanza a llenar ni un bloque entero. Es Propia." : "Fíjate en el gráfico. Se necesita más de un bloque entero. Es Impropia.");
            };

            return (
                <div className="horizontal-layout">
                    <div className="robot-pane">
                        <RobotGuide text="Observa el gráfico de la fracción. ¿Es Propia o Impropia? Coloca la etiqueta correcta." />
                        <Button onClick={check} variant="primary" className="mt-12 w-full text-3xl py-6">Comprobar</Button>
                    </div>
                    
                    <div className="interaction-pane">
                        <div className="glass-panel p-16 rounded-[4rem] border-4 border-[var(--brand-tertiary)] shadow-2xl flex flex-col items-center justify-center gap-10 w-full min-w-[500px]">
                            
                            <div className="flex flex-row items-center justify-center gap-12 bg-slate-900/50 p-8 rounded-[3rem] w-full">
                                <FractionDisplay num={data.num} den={data.den} />
                                <div className="w-1 h-32 bg-white/20 rounded-full"></div>
                                <FractionGraphic n={data.num} d={data.den} theme="default" />
                            </div>
                            
                            <div onClick={handleDrop} className={`w-80 h-32 rounded-3xl dropzone ${selected && !placed ? 'active' : ''} ${placed ? 'filled' : ''}`}>
                                {placed ? (
                                    <div onClick={handleRemove} className="w-full h-full bg-[var(--brand-yellow)] text-slate-900 rounded-2xl flex items-center justify-center text-5xl font-black pop-in cursor-pointer shadow-[0_0_20px_rgba(255,230,0,0.6)] uppercase tracking-wider">
                                        {placed}
                                    </div>
                                ) : <span className="text-slate-400 font-bold text-2xl text-center px-2">Colocar Etiqueta</span>}
                            </div>
                        </div>

                        <div className="flex flex-row gap-8 bg-slate-800/80 p-8 rounded-[3rem] border-4 border-slate-600 w-full justify-center">
                            {['Propia', 'Impropia'].map(sym => (
                                <div key={sym} onClick={() => handleSelect(sym)}
                                    className={`draggable-item px-10 h-28 text-4xl font-black rounded-2xl flex items-center justify-center border-4 shadow-xl uppercase tracking-wider ${
                                        selected === sym ? 'pulse-glow bg-[var(--brand-secondary)] text-slate-900' : 'bg-slate-700 text-white border-slate-500'
                                    } ${placed === sym ? 'opacity-30 grayscale pointer-events-none' : ''}`}
                                >
                                    {sym}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- BLOQUE 2: Armando el Mixto (Problemas Gráficos Llamativos) ---
        const ActMixedWord = ({ data, onComplete, onError }) => {
            const [selected, setSelected] = useState(null);
            const [placed, setPlaced] = useState({ w: null, n: null, d: null });
            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const handleSelect = (num) => { playPop(); setSelected(num); };
            const handleDrop = (zone) => { if (selected !== null) { playPlace(); setPlaced({ ...placed, [zone]: selected }); setSelected(null); } };
            const handleRemove = (zone, e) => { e.stopPropagation(); playPop(); setPlaced({ ...placed, [zone]: null }); };

            const check = () => {
                if (placed.w === null || placed.n === null || placed.d === null) { onError("¡Arma el número mixto completo!"); return; }
                if (placed.w === data.ansW && placed.n === data.ansN && placed.d === data.ansD) onComplete();
                else onError("Cuenta los bloques llenos para el entero. Lo que sobra forma la fracción.");
            };

            return (
                <div className="horizontal-layout">
                    <div className="robot-pane">
                        <RobotGuide text="Lee el problema y observa los gráficos llamativos. Forma el número mixto. Puedes usar el mismo número varias veces." />
                        <Button onClick={check} variant="primary" className="mt-12 w-full text-3xl py-6">Comprobar</Button>
                    </div>
                    
                    <div className="interaction-pane">
                        <div className="flex flex-col gap-6 w-full min-w-[500px]">
                            <div className="glass-panel p-8 rounded-[3rem] border-l-8 border-[var(--brand-secondary)] shadow-xl w-full text-2xl font-bold leading-relaxed text-white">
                                {data.text}
                                <div className="mt-6 flex flex-col items-center gap-6 bg-slate-900/70 p-6 rounded-2xl w-full border-2 border-slate-600">
                                    <div className="flex items-center gap-6 justify-center w-full">
                                        <div className="scale-75 origin-center"><FractionDisplay num={data.origN} den={data.origD} /></div>
                                        <div className="text-white text-3xl font-black">=</div>
                                        <div className="scale-110"><FractionGraphic n={data.origN} d={data.origD} theme={data.theme} /></div>
                                    </div>
                                </div>
                            </div>

                            <div className="glass-panel p-10 rounded-[3rem] border-4 border-[var(--brand-green)] flex flex-row items-center justify-center gap-8 shadow-[0_0_30px_rgba(0,255,102,0.2)]">
                                <div onClick={() => handleDrop('w')} className={`w-32 h-36 rounded-3xl dropzone flex-col ${selected && !placed.w ? 'active' : ''} ${placed.w ? 'filled border-[var(--brand-green)] bg-[var(--brand-green)]/20' : ''}`}>
                                    {placed.w ? (
                                        <div onClick={(e) => handleRemove('w', e)} className="w-full h-full bg-[var(--brand-green)] text-slate-900 rounded-2xl flex items-center justify-center text-7xl font-black pop-in cursor-pointer shadow-lg">{placed.w}</div>
                                    ) : <span className="text-slate-400 font-bold">Entero</span>}
                                </div>

                { type: 'algebra_balance', xCount: 3, xValue: 30, addValue: 10, totalValue: 100, pool: [20, 30, 40, 50] },
                { type: 'algebra_balance', xCount: 4, xValue: 20, addValue: 20, totalValue: 100, pool: [10, 20, 30, 40] },
                { type: 'algebra_balance', xCount: 2, xValue: 40, addValue: 10, totalValue: 90, pool: [30, 40, 50, 60] },
                { type: 'algebra_balance', xCount: 5, xValue: 10, addValue: 0, totalValue: 50, pool: [5, 10, 15, 20] },
                { type: 'algebra_balance', xCount: 3, xValue: 25, addValue: 15, totalValue: 90, pool: [15, 25, 35, 45] },
                { type: 'algebra_balance', xCount: 2, xValue: 120, addValue: 60, totalValue: 300, pool: [100, 110, 120, 130] },
                { type: 'algebra_balance', xCount: 4, xValue: 15, addValue: 10, totalValue: 70, pool: [10, 15, 20, 25] } 
            ],
            // BLOQUE 5: Dual Mixto (Gráfico y Recta) (8 items)
            [
                { type: 'dual_mixed', w: 1, n: 1, d: 2 }, 
                { type: 'dual_mixed', w: 2, n: 1, d: 6 }, 
                { type: 'dual_mixed', w: 1, n: 5, d: 8 }, 
                { type: 'dual_mixed', w: 2, n: 3, d: 4 }, 
                { type: 'dual_mixed', w: 3, n: 1, d: 3 }, 
                { type: 'dual_mixed', w: 1, n: 2, d: 5 }, 
                { type: 'dual_mixed', w: 2, n: 1, d: 4 }, 
                { type: 'dual_mixed', w: 3, n: 3, d: 5 }  
            ]
        ];

        const MissionHub = ({ onSelectBlock, completedBlocks }) => {
            const blockNames = ["Clasificar Gráficamente", "Resolviendo Problemas", "Ecuación: Halla X", "Balanza Algebraica", "Gráfico y Recta (Mixtos)"];
            return (
                <div className="flex flex-col items-center justify-center h-full w-full max-w-7xl mx-auto p-12 pop-in">
                    <h1 className="text-7xl font-black text-white mb-4 uppercase neon-text text-center tracking-wide">Centro de Mando</h1>
                    <p className="text-3xl text-[var(--brand-secondary)] mb-12 font-bold text-center">Selecciona tu entrenamiento táctil, Agente.</p>
                    
                    <div className="flex flex-wrap justify-center gap-10 w-full px-4 max-w-6xl">
                        {blockNames.map((name, index) => {
                            const isCompleted = completedBlocks.includes(index);
                            return (
                                <button key={index} onClick={() => onSelectBlock(index)}
                                    className={`relative flex flex-col items-center justify-center p-10 rounded-[3rem] border-4 transition-all bouncy-hover shadow-2xl overflow-hidden min-h-[250px] flex-1 min-w-[300px] max-w-[400px]
                                        ${isCompleted ? 'bg-[var(--brand-green)]/10 border-[var(--brand-green)] hover:bg-[var(--brand-green)]/30' : 'bg-slate-800/80 border-slate-500 hover:border-white hover:bg-slate-700'}
                                    `}
                                >
                                    {isCompleted && <div className="absolute top-4 right-4 bg-[var(--brand-green)] text-slate-900 rounded-full p-2 shadow-[0_0_15px_rgba(0,255,102,1)]"><Star size={32} className="fill-current"/></div>}
                                    <div className={`text-7xl font-black mb-4 ${isCompleted ? 'text-[var(--brand-green)]' : 'text-slate-400'}`}>0{index + 1}</div>
                                    <h3 className="text-3xl font-bold text-white text-center leading-tight">{name}</h3>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const SuccessModal = ({ isVisible, onNext, isBlockComplete }) => {
            const playWin = useSound(isBlockComplete ? 'win' : 'success');
            useEffect(() => { if(isVisible) playWin(); }, [isVisible, playWin]);
            if (!isVisible) return null;
            return (
                <div className="absolute inset-0 bg-[#0B0E14]/95 backdrop-blur-xl z-[200] flex items-center justify-center pop-in">
                    <Confetti />
                    <div className="glass-panel p-20 rounded-[4rem] shadow-[0_0_100px_rgba(0,255,102,0.3)] flex flex-col items-center text-center max-w-3xl border-8 border-[var(--brand-green)] relative">
                        <div className="w-48 h-48 bg-[var(--brand-green)]/20 text-[var(--brand-green)] rounded-full flex items-center justify-center mb-10 float-anim border-4 border-[var(--brand-green)]">
                            <Check size={120} />
                        </div>
                        <h2 className="text-7xl font-black text-white mb-8 neon-text">¡Misión Cumplida!</h2>
                        <div className="bg-[var(--brand-yellow)] text-slate-900 font-black text-4xl px-12 py-5 rounded-full mb-12 shadow-[0_0_30px_rgba(255,230,0,0.5)] transform -rotate-2">
                            +20 PUNTOS
                        </div>
                        <Button onClick={onNext} variant="secondary" className="text-5xl px-20 py-8">
                            {isBlockComplete ? "Volver al Menú" : "Siguiente Nivel"} <ArrowLeft size={40} className="transform rotate-180" />
                        </Button>
                    </div>
                </div>
            );
        };

        function TuProfe20LabV2() {
            const [view, setView] = useState('start');
            const [currentBlock, setCurrentBlock] = useState(0);
            const [currentLevel, setCurrentLevel] = useState(0);
            const [completedBlocks, setCompletedBlocks] = useState([]);
            const [showCheck, setShowCheck] = useState(false);
            const [errorMsg, setErrorMsg] = useState("");
            const [soundOn, setSoundOn] = useState(() => localStorage.getItem('tuprofe20-sound') !== 'off');
            
            const playClick = useSound('click');
            const playError = useSound('wrong');

            const totalScore = completedBlocks.length * 160 + (view === 'playing' ? currentLevel * 20 : 0);

            useEffect(() => {
                const saved = localStorage.getItem('tuprofe20-progress');
                if (saved) { try { setCompletedBlocks(JSON.parse(saved)); } catch (_) {} }
            }, []);
            useEffect(() => { soundEnabled = soundOn; localStorage.setItem('tuprofe20-sound', soundOn ? 'on' : 'off'); }, [soundOn]);
            useEffect(() => { localStorage.setItem('tuprofe20-progress', JSON.stringify(completedBlocks)); }, [completedBlocks]);
            useEffect(() => {
                const onKey = (event) => { if (event.key === 'Escape' && view === 'playing') setView('hub'); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [view]);

            const handleStart = () => { playClick(); setView('hub'); };
            const handleSelectBlock = (blockIndex) => { playClick(); setCurrentBlock(blockIndex); setCurrentLevel(0); setView('playing'); };
            
            const handleSuccess = () => { setShowCheck(true); setErrorMsg(""); };
            const handleError = (msg) => { playError(); setErrorMsg(msg); setTimeout(() => setErrorMsg(""), 5500); };

            const handleNext = () => { 
                setShowCheck(false);
                if (currentLevel < 7) { 
                    setCurrentLevel(l => l + 1); 
                } 
                else {
                    if (!completedBlocks.includes(currentBlock)) setCompletedBlocks([...completedBlocks, currentBlock]);
                    setView('hub');
                }
            };

            const renderCurrentActivity = () => {
                const mission = missionsData[currentBlock][currentLevel];
                const props = { data: mission, onComplete: handleSuccess, onError: handleError };

                switch (mission.type) {
                    case 'classify': return <ActClassifyGraphic key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'mixed_word': return <ActMixedWord key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'eq_balance_1': return <ActEquationBalance key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'algebra_balance': return <ActAlgebraBalance key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'dual_mixed': return <ActMixedNumberLine key={`${currentBlock}-${currentLevel}`} {...props} />;
                    default: return <div>Cargando...</div>;
                }
            };

            return (
                <div className="app-container">
                    <DynamicBackground />
                    
                    {view !== 'start' && (
                        <div className="min-h-24 bg-slate-900/90 backdrop-blur-xl border-b border-white/10 px-4 md:px-12 py-3 flex items-center justify-between gap-4 shadow-2xl z-20 shrink-0 w-full">
                            <div className="flex items-center gap-6">
                                {view === 'playing' && (
                                    <button onClick={() => {playClick(); setView('hub');}} className="w-16 h-16 bg-slate-800 hover:bg-[var(--brand-primary)] border-2 border-slate-600 hover:border-white rounded-2xl flex items-center justify-center transition-all bouncy-hover text-white shadow-lg">
                                        <ArrowLeft size={36} />
                                    </button>
                                )}
                                <div className="font-black text-white uppercase tracking-widest text-lg md:text-3xl drop-shadow-md">
                                    {view === 'hub' ? "Centro de Mando" : `Bloque ${currentBlock + 1} - Nivel ${currentLevel + 1}/8`}
                                    {view === 'playing' && <div className="progress-track w-40 md:w-72 mt-2"><div className="progress-fill" style={{width: `${((currentLevel + 1) / 8) * 100}%`}} /></div>}
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2 md:gap-4">
                            <button type="button" onClick={() => setSoundOn(v => !v)} className="icon-button bouncy-hover text-2xl" aria-label={soundOn ? 'Silenciar sonidos' : 'Activar sonidos'} title={soundOn ? 'Silenciar' : 'Activar sonido'}>{soundOn ? '🔊' : '🔇'}</button>
                            <div className="flex items-center gap-2 bg-slate-800/80 px-3 md:px-8 py-3 md:py-4 rounded-full border-2 border-[var(--brand-yellow)] shadow-[0_0_20px_rgba(255,230,0,0.3)]">
                                <Star size={36} className="text-[var(--brand-yellow)] fill-current animate-pulse" />
                                <span className="font-black text-[var(--brand-yellow)] text-xl md:text-4xl">{totalScore} PTS</span>
                            </div>
                            </div>
                        </div>
                    )}

                    {errorMsg && (
                        <div className="absolute top-40 left-1/2 -translate-x-1/2 bg-[var(--brand-primary)] text-white px-12 py-6 rounded-[2rem] font-bold text-3xl shadow-[0_15px_50px_rgba(255,0,122,0.8)] z-[300] flex items-center gap-6 pop-in border-4 border-white text-center">
                            <AlertCircle size={48} className="shrink-0" />
                            {errorMsg}
                        </div>
                    )}

                    <div className="flex-grow relative overflow-hidden flex items-center justify-center w-full">
                        {view === 'start' && (
                            <div className="flex flex-col lg:flex-row items-center justify-center gap-8 lg:gap-24 glass-panel p-6 md:p-12 lg:p-20 rounded-[3rem] lg:rounded-[4rem] border-4 border-white/10 shadow-[0_0_100px_rgba(0,0,0,0.8)] pop-in w-11/12 max-w-7xl h-auto min-h-[70vh] my-6">
                                
                                <div className="flex flex-col items-center justify-center relative wiggle">
                                    <AnimatedRobot size={260} className="drop-shadow-[0_0_50px_rgba(0,240,255,0.8)] z-10" />
                                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-[var(--brand-secondary)]/20 rounded-full blur-3xl -z-10"></div>
                                </div>

                                <div className="flex flex-col items-center justify-center lg:border-l-4 border-white/10 lg:pl-24 text-center">
                                    <h1 className="text-5xl md:text-7xl lg:text-[100px] font-black text-white leading-tight tracking-tighter neon-text uppercase text-center">
                                        TuProfe20<br/>
                                        <span className="text-[var(--brand-secondary)] text-6xl md:text-8xl lg:text-[120px]">LAB</span>
                                    </h1>
                                    
                                    <div className="bg-[var(--brand-yellow)]/20 border-4 border-[var(--brand-yellow)] rounded-3xl px-12 py-4 mt-8 mb-12 shadow-[0_0_30px_rgba(255,230,0,0.4)] transform -rotate-2 max-w-2xl">
                                        <p className="text-2xl md:text-4xl font-black text-[var(--brand-yellow)] tracking-widest uppercase m-0 drop-shadow-md text-center leading-tight">
                                            Fracciones e<br/>Igualdades Numéricas
                                        </p>
                                    </div>
                                    
                                    <Button onClick={handleStart} variant="primary" className="text-5xl px-20 py-8 shadow-[0_0_60px_rgba(255,0,122,0.6)] group">
                                        ¡COMENZAR! <Play size={50} className="group-hover:translate-x-2 transition-transform" />
                                    </Button>
                                </div>
                            </div>
                        )}
                        
                        {view === 'hub' && <MissionHub onSelectBlock={handleSelectBlock} completedBlocks={completedBlocks} />}
                        {view === 'playing' && renderCurrentActivity()}
                    </div>

                    <SuccessModal isVisible={showCheck} onNext={handleNext} isBlockComplete={currentLevel === 7} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TuProfe20LabV2 />);
    </script>
</body>
</html>
