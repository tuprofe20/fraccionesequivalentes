<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuProfe20 Lab Fracciones Equivalentes</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-primary: #FF007A;
            --brand-secondary: #00F0FF;
            --brand-tertiary: #B000FF;
            --brand-yellow: #FFEA00;
            --brand-green: #00FF66;
            --brand-orange: #FF5500;
            --brand-bg: #0b061e;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--brand-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .space-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10;
            background: linear-gradient(-45deg, #090a0f, #1a0b2e, #0f172a, #200030);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .milky-way {
            position: absolute; width: 200vw; height: 200vh; top: -50vh; left: -50vw;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 50px 160px, var(--brand-secondary), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 160px 120px, var(--brand-primary), rgba(0,0,0,0));
            background-repeat: repeat; background-size: 300px 300px;
            animation: rotateMilkyWay 250s linear infinite; opacity: 0.4;
        }

        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle linear infinite alternate; box-shadow: 0 0 10px #fff; }
        .floating-math { position: absolute; font-weight: 900; font-family: 'Nunito', sans-serif; opacity: 0.15; animation: floatMath linear infinite; user-select: none; pointer-events: none; }

        @keyframes rotateMilkyWay { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 15px #fff, 0 0 5px var(--brand-secondary); } }
        @keyframes floatMath { 0% { transform: translateY(110vh) rotate(0deg); } 100% { transform: translateY(-10vh) rotate(360deg); } }

        @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }
        @keyframes waveL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-15deg); } }
        @keyframes waveR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(15deg); } }
        .anim-blink { transform-origin: center; animation: blink 4s infinite; }
        .anim-wave-l { transform-origin: 20px 50px; animation: waveL 3s ease-in-out infinite; }
        .anim-wave-r { transform-origin: 100px 50px; animation: waveR 3s ease-in-out infinite; }

        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .app-container { font-family: 'Nunito', sans-serif; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .bouncy-hover { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bouncy-hover:hover { transform: translateY(-8px) scale(1.05); }
        .bouncy-hover:active { transform: translateY(2px) scale(0.95); }
        
        .glass-panel { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 15px 50px 0 rgba(0, 0, 0, 0.6); }
        
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .float-anim { animation: floating 3s ease-in-out infinite; }
        .pulse-glow { animation: pulseGlow 1.5s infinite; }
        .wiggle { animation: wiggle 3s ease-in-out infinite; }
        .neon-text { text-shadow: 0 0 25px currentColor, 0 0 50px currentColor; }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 15px #fff; transform: scale(1.05); border-color: #fff; } 50% { box-shadow: 0 0 40px #fff; transform: scale(1.1); border-color: var(--brand-secondary); } }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg) translateY(0); } 25% { transform: rotate(-5deg) translateY(-10px); } 75% { transform: rotate(5deg) translateY(5px); } }

        .horizontal-layout { display: flex; flex-direction: row; align-items: center; justify-content: center; width: 100%; max-width: 1500px; height: 100%; padding: 1rem md:padding: 2rem; gap: 2rem lg:gap: 4rem; margin: 0 auto; }
        .robot-pane { width: 100%; max-width: 320px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        .interaction-pane { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem md:gap: 2.5rem; flex: 1; width: 100%; }

        .draggable-item { cursor: pointer; transition: all 0.3s ease; user-select: none; }
        .draggable-item:hover { transform: scale(1.05) translateY(-3px); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .dropzone { transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(0,0,0,0.3); }
        .dropzone.active { border-color: var(--brand-green); background: rgba(0, 255, 102, 0.15); animation: pulseGlow 1.5s infinite; }
        .dropzone.filled { border-style: solid; border-color: var(--brand-yellow); background: rgba(255, 234, 0, 0.15); }

        .confetti-piece { position: absolute; width: 14px; height: 28px; opacity: 0; animation: fall linear forwards; }
        @keyframes fall { 0% { opacity: 1; top: -10%; transform: rotate(0deg); } 100% { opacity: 0; top: 110%; transform: rotate(720deg); } }

        .icon-button { width: 3rem; height: 3rem; border-radius: 1rem; display: grid; place-items: center; background: rgba(30,41,59,.9); border: 2px solid rgba(255,255,255,.2); transition: all 0.3s ease; }
        @media (min-width: 768px) { .icon-button { width: 3.5rem; height: 3.5rem; } }
        .icon-button:hover { background: var(--brand-primary); border-color: white; transform: scale(1.1) rotate(5deg); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (max-width: 1024px) {
            body { overflow: auto; }
            .app-container { min-height: 100dvh; height: auto; }
            .horizontal-layout { flex-direction: column; height: auto; min-height: 100%; padding: 1rem; gap: 1.25rem; overflow-y: auto; overflow-x: hidden;}
            .robot-pane { width: 100%; max-width: 400px; }
            .interaction-pane { width: 100%; gap: 1rem; }
            .bouncy-hover:hover { transform: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Play = (p) => <IconBase {...p}><polygon points="5 3 19 12 5 21 5 3"/></IconBase>;
        const Star = (p) => <IconBase {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const AlertCircle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>;
        const Check = (p) => <IconBase {...p}><polyline points="20 6 9 17 4 12"/></IconBase>;
        const ArrowLeft = (p) => <IconBase {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconBase>;
        const Lock = (p) => <IconBase {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></IconBase>;
        const Rocket = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path></svg>;

        const audioCtx = typeof window !== 'undefined' ? new (window.AudioContext || window.webkitAudioContext)() : null;
        const playTone = (freq, type, duration, vol = 0.1, sweep = false) => {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                if (sweep) {
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(freq / 2, audioCtx.currentTime + duration);
                } else {
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                }
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        };

        let soundEnabled = true;
        const soundLibrary = {
            pop: () => playTone(800, 'sine', 0.1, 0.1, true),
            click: () => playTone(1200, 'triangle', 0.05, 0.1),
            place: () => playTone(600, 'sine', 0.1, 0.2), 
            success: () => { playTone(523.25, 'sine', 0.1, 0.2); setTimeout(() => playTone(659.25, 'sine', 0.1, 0.2), 100); setTimeout(() => playTone(783.99, 'sine', 0.2, 0.2), 200); },
            wrong: () => { playTone(250, 'sawtooth', 0.2, 0.2, true); setTimeout(() => playTone(200, 'sawtooth', 0.3, 0.2, true), 150); },
            win: () => { [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.3, 0.2), i * 150)); }
        };
        const useSound = (soundKey) => useCallback(() => { if (soundEnabled && soundLibrary[soundKey]) soundLibrary[soundKey](); }, [soundKey]);

        const DynamicBackground = () => {
            const [stars, setStars] = useState([]);
            const [symbols, setSymbols] = useState([]);
            
            useEffect(() => {
                const s = Array.from({length: 80}).map((_, i) => ({
                    id: i, left: `${Math.random() * 100}vw`, top: `${Math.random() * 100}vh`,
                    size: `${Math.random() * 3 + 1}px`, animDuration: `${2 + Math.random() * 5}s`, animDelay: `-${Math.random() * 5}s`
                }));
                setStars(s);

                const mathSyms = ['½', '¾', '×', '÷', '+', '=', '¼'];
                const sym = Array.from({length: 10}).map((_, i) => ({
                    id: i, char: mathSyms[Math.floor(Math.random() * mathSyms.length)],
                    left: `${Math.random() * 100}vw`, fontSize: `${Math.random() * 40 + 30}px`,
                    animDuration: `${20 + Math.random() * 20}s`, animDelay: `-${Math.random() * 20}s`,
                    color: ['var(--brand-primary)', 'var(--brand-secondary)', 'var(--brand-yellow)'][Math.floor(Math.random() * 3)]
                }));
                setSymbols(sym);
            }, []);

            return (
                <div className="space-bg">
                    <div className="milky-way"></div>
                    {stars.map(s => <div key={`s-${s.id}`} className="star" style={{left: s.left, top: s.top, width: s.size, height: s.size, animationDuration: s.animDuration, animationDelay: s.animDelay}}></div>)}
                    {symbols.map(s => <div key={`sym-${s.id}`} className="floating-math" style={{left: s.left, fontSize: s.fontSize, color: s.color, animationDuration: s.animDuration, animationDelay: s.animDelay}}>{s.char}</div>)}
                </div>
            );
        };

        const AnimatedRobot = ({ size = 120, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 120 120" className={`overflow-visible float-anim ${className}`} xmlns="http://www.w3.org/2000/svg">
                <line x1="60" y1="20" x2="60" y2="5" stroke="#94A3B8" strokeWidth="5" strokeLinecap="round" />
                <circle cx="60" cy="5" r="6" fill="#34d399" className="animate-pulse" filter="drop-shadow(0 0 6px #34d399)" />
                <g className="anim-wave-l">
                    <rect x="5" y="45" width="16" height="30" rx="8" fill="#CBD5E1" stroke="#94A3B8" strokeWidth="4" transform="rotate(20 13 60)" />
                </g>
                <g className="anim-wave-r">
                    <rect x="99" y="45" width="16" height="30" rx="8" fill="#CBD5E1" stroke="#94A3B8" strokeWidth="4" transform="rotate(-20 107 60)" />
                </g>
                <rect x="20" y="25" width="80" height="75" rx="20" fill="#F1F5F9" stroke="#94A3B8" strokeWidth="6" />
                <rect x="29" y="34" width="62" height="57" rx="12" fill="#1E293B" />
                <g className="anim-blink">
                    <path d="M 38 56 A 7 7 0 0 1 52 56 Z" fill="#34d399" />
                    <path d="M 68 56 A 7 7 0 0 1 82 56 Z" fill="#34d399" />
                </g>
                <path d="M 46 62 C 46 82, 74 82, 74 62 Z" fill="#FF4D6D" />
            </svg>
        );

        const RobotGuide = ({ text, children }) => (
            <div className="flex flex-col items-center gap-4 w-full relative z-20">
                <div className="relative bg-slate-900/80 backdrop-blur-md p-6 rounded-[3rem] border-4 border-[var(--brand-secondary)] shadow-[0_0_30px_rgba(0,240,255,0.6)] wiggle">
                    <AnimatedRobot size={120} className="md:w-[150px] md:h-[150px]" />
                </div>
                <div className="glass-panel text-white p-4 md:p-6 rounded-3xl rounded-tl-none border-t-4 border-[var(--brand-tertiary)] font-bold text-sm md:text-xl relative pop-in text-center leading-relaxed w-full shadow-2xl flex flex-col items-center gap-4 bg-gradient-to-br from-slate-800 to-slate-900">
                    {text}
                    {children}
                    <div className="absolute -top-4 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[12px] border-l-transparent border-b-[18px] border-b-[var(--brand-tertiary)] border-r-[12px] border-r-transparent"></div>
                </div>
            </div>
        );

        const Button = ({ children, onClick, variant = 'primary', className = '' }) => {
            const playClick = useSound('click');
            const variants = { 
                primary: "bg-gradient-to-r from-[var(--brand-primary)] to-[var(--brand-tertiary)] shadow-[0_6px_0_0_#500099] hover:brightness-125 text-white border-2 border-white/30", 
                secondary: "bg-gradient-to-r from-[var(--brand-secondary)] to-[#0099ff] shadow-[0_6px_0_0_#005599] hover:brightness-125 text-white border-2 border-white/30" 
            };
            return <button type="button" onClick={(e) => { playClick(); if(onClick) onClick(e); }} className={`bouncy-hover font-black py-3 px-6 md:py-4 md:px-10 rounded-full text-lg md:text-2xl transition-all flex items-center justify-center gap-2 md:gap-3 uppercase tracking-wider z-20 relative ${variants[variant]} ${className}`}>{children}</button>;
        };

        const FractionDisplay = ({ num, den }) => (
            <div className="flex flex-col items-center justify-center font-black text-white px-2 md:px-4">
                <span className="text-3xl md:text-6xl border-b-2 md:border-b-4 border-white pb-1 px-2 md:px-4 text-center min-w-[2ch] md:min-w-[3ch] drop-shadow-md">{num}</span>
                <span className="text-3xl md:text-6xl pt-1 px-2 md:px-4 text-center min-w-[2ch] md:min-w-[3ch] drop-shadow-md">{den}</span>
            </div>
        );

        const FractionGraphic = ({ n, d, theme = 'default', sizeClass = "w-full md:w-56 h-12 md:h-16" }) => {
            const wholes = Math.ceil(n / d) || 1;
            const getThemeColors = () => {
                if(theme === 'chocolate') return { bg: 'bg-[#3E2723]', fill: 'bg-[#5D4037]', border: 'border-[#1b100e]' };
                if(theme === 'pizza') return { bg: 'bg-orange-200', fill: 'bg-yellow-400', border: 'border-orange-500' };
                return { bg: 'bg-slate-800', fill: 'bg-[var(--brand-secondary)]', border: 'border-slate-500' };
            };
            const colors = getThemeColors();

            return (
                <div className="flex flex-wrap gap-2 md:gap-4 justify-center items-center w-full">
                    {Array.from({length: wholes}).map((_, wIdx) => (
                        <div key={wIdx} className={`flex border-2 md:border-4 ${colors.border} rounded-lg md:rounded-xl overflow-hidden ${colors.bg} shadow-[0_5px_15px_rgba(0,0,0,0.5)] ${sizeClass}`}>
                            {Array.from({length: d}).map((_, dIdx) => {
                                const isShaded = (wIdx * d) + dIdx < n;
                                return <div key={dIdx} className={`flex-1 h-full border-r-[1px] md:border-r-2 ${colors.border} last:border-r-0 ${isShaded ? colors.fill : ''} ${isShaded ? 'shadow-[inset_0_0_10px_rgba(255,255,255,0.4)]' : ''}`}></div>;
                            })}
                        </div>
                    ))}
                </div>
            );
        };

        const Confetti = () => {
            const [pieces, setPieces] = useState([]);
            useEffect(() => {
                const colors = ['#FF007A', '#00F0FF', '#FFE600', '#B000FF', '#00FF66'];
                setPieces(Array.from({ length: 100 }).map((_, i) => ({ id: i, left: `${Math.random() * 100}%`, animationDuration: `${Math.random() * 2 + 1}s`, animationDelay: `${Math.random() * 0.5}s`, backgroundColor: colors[Math.floor(Math.random() * colors.length)], transform: `rotate(${Math.random() * 360}deg)` })));
            }, []);
            return <div className="absolute inset-0 overflow-hidden pointer-events-none z-[100]">{pieces.map(p => <div key={p.id} className="confetti-piece rounded-sm" style={p} />)}</div>;
        };


        // --- BLOQUE 1: Rectas Numéricas Interactivas ---
        const ActNumberLineInteractive = ({ data, onComplete, onError }) => {
            const [markerPos, setMarkerPos] = useState(null);
            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const handleTickClick = (idx) => { playPlace(); setMarkerPos(idx); };
            const check = () => {
                if (markerPos === null) { onError("¡Toca una marca en la segunda recta para colocar tu láser!", false); return; }
                if (markerPos === data.correctN) onComplete();
                else onError("El láser no está perfectamente derecho. Esas fracciones no son equivalentes.");
            };

            const pos1 = (data.f1.n / data.f1.d) * 100;
            const pos2 = markerPos !== null ? (markerPos / data.d2) * 100 : null;

            const NumberLineFixed = ({ frac }) => (
                <div className="w-full relative h-12 md:h-16 flex items-center">
                    <div className="absolute top-1/2 left-0 w-full h-1 md:h-2 bg-slate-500 rounded-full -translate-y-1/2"></div>
                    {Array.from({ length: frac.d + 1 }).map((_, i) => (
                        <div key={i} className="absolute top-1/2 w-0.5 md:w-1 h-6 md:h-8 bg-slate-300" style={{ left: `${(i / frac.d) * 100}%`, transform: 'translate(-50%, -50%)' }}>
                            <span className="absolute bottom-6 md:bottom-10 left-1/2 -translate-x-1/2 text-xs md:text-lg font-bold text-slate-300">{i}/{frac.d}</span>
                        </div>
                    ))}
                    <div className="absolute top-1/2 w-[4px] md:w-[8px] h-8 md:h-12 bg-[var(--brand-primary)] z-10 shadow-[0_0_15px_var(--brand-primary)]" style={{ left: `${pos1}%`, transform: 'translate(-50%, -50%)' }}>
                        <div className="absolute -top-10 md:-top-14 left-1/2 -translate-x-1/2 bg-[var(--brand-primary)] text-white px-2 py-1 md:px-4 md:py-2 rounded-lg md:rounded-xl font-black text-sm md:text-2xl shadow-lg border-2 border-white/50 flex items-center justify-center">
                            {frac.n}/{frac.d}
                        </div>
                    </div>
                </div>
            );

            const NumberLineInteractive = ({ divisions }) => (
                <div className="w-full relative h-12 md:h-16 flex items-center">
                    <div className="absolute top-1/2 left-0 w-full h-1 md:h-2 bg-slate-500 rounded-full -translate-y-1/2"></div>
                    {Array.from({ length: divisions + 1 }).map((_, i) => (
                        <div key={i} onClick={() => handleTickClick(i)} 
                             className="absolute top-1/2 w-6 md:w-8 h-12 md:h-16 bg-transparent cursor-pointer group flex justify-center items-center z-20" 
                             style={{ left: `${(i / divisions) * 100}%`, transform: 'translate(-50%, -50%)' }}>
                            <div className={`w-0.5 md:w-1 h-6 md:h-8 transition-colors ${markerPos === i ? 'bg-[var(--brand-yellow)] h-8 md:h-12' : 'bg-slate-300 group-hover:bg-white group-hover:h-8 md:group-hover:h-12 shadow-[0_0_10px_rgba(255,255,255,0.5)]'}`}></div>
                            <span className="absolute top-[110%] left-1/2 -translate-x-1/2 text-xs md:text-lg font-bold text-slate-300">{i}/{divisions}</span>
                        </div>
                    ))}
                    {markerPos !== null && (
                        <div className="absolute top-1/2 w-[4px] md:w-[8px] h-8 md:h-12 bg-[var(--brand-yellow)] z-10 shadow-[0_0_25px_var(--brand-yellow)] pop-in pointer-events-none" 
                             style={{ left: `${(markerPos / divisions) * 100}%`, transform: 'translate(-50%, -50%)' }}>
                            <div className="absolute -bottom-10 md:-bottom-14 left-1/2 -translate-x-1/2 bg-[var(--brand-yellow)] text-slate-900 px-2 py-1 md:px-4 md:py-2 rounded-lg md:rounded-xl font-black text-sm md:text-2xl shadow-lg border-2 border-white flex items-center justify-center">
                                {markerPos}/{divisions}
                            </div>
                        </div>
                    )}
                </div>
            );

            return (
                <div className="horizontal-layout">
                    <div className="robot-pane">
                        <RobotGuide text="¡Conecta el rayo láser! Toca la marca en la recta inferior que se alinee directamente con la fracción inicial." />
                        <Button onClick={check} variant="primary" className="mt-6 md:mt-12 w-full text-xl md:text-3xl py-4 md:py-6">¡Activar Láser!</Button>
                    </div>
                    <div className="interaction-pane">
                        <div className="glass-panel p-6 md:p-10 rounded-[2rem] md:rounded-[3rem] border-4 border-[var(--brand-tertiary)] shadow-[0_0_40px_rgba(176,0,255,0.3)] flex flex-col items-center justify-center w-full max-w-4xl bg-gradient-to-b from-slate-900/90 to-slate-800/90">
                            <div className="w-full px-4 md:px-12 relative py-4 md:py-8">
                                <span className="text-sm md:text-xl font-black text-[var(--brand-primary)] tracking-widest uppercase mb-4 block drop-shadow-md text-center md:text-left">Posición Inicial</span>
                                
                                <div className="relative w-full">
                                    <NumberLineFixed frac={data.f1} />
                                    
                                    <div className="h-20 md:h-28 w-full flex items-center justify-center relative z-0">
                                        <div className="border-t-2 border-dashed border-white/20 w-full"></div>
                                        <span className="absolute bg-slate-900/80 px-4 py-1 rounded-full text-xs md:text-sm text-slate-400 font-bold uppercase tracking-widest">Alineamiento Láser</span>
                                    </div>
                                    
                                    <NumberLineInteractive divisions={data.d2} />
                                    
                                    {/* SVG LÁSER VISUAL */}
                                    {markerPos !== null && (
                                        <svg className="absolute top-6 md:top-8 bottom-6 md:bottom-8 left-0 w-full pointer-events-none z-10 pop-in" style={{ overflow: 'visible' }}>
                                            <line x1={`${pos1}%`} y1="0" x2={`${pos2}%`} y2="100%" stroke="var(--brand-yellow)" strokeWidth="4" strokeDasharray="10 10" className="drop-shadow-[0_0_12px_rgba(255,234,0,1)] animate-pulse" />
                                        </svg>
                                    )}
                                </div>
                                
                                <span className="text-sm md:text-xl font-black text-[var(--brand-yellow)] tracking-widest uppercase mt-6 block drop-shadow-md text-center md:text-left">Apunta tu láser aquí</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- BLOQUE 2: Figuras Equivalentes ---
        const ActVisualEquivalence = ({ data, onComplete, onError }) => {
            const playPop = useSound('pop');
            const playPlace = useSound('place');
            
            const check = (opt) => {
                playPlace();
                if (opt.n === data.correct.n && opt.d === data.correct.d) onComplete();
                else onError("Fíjate bien: el área total pintada debe verse exactamente del mismo tamaño que el holograma base.");
            };

            return (
                <div className="horizontal-layout">
                    <div className="robot-pane">
                        <RobotGuide text="¡Escáner activado! Toca la opción que tenga el mismo tamaño de área pintada que la figura base." />
                    </div>
                    <div className="interaction-pane">
                        <div className="glass-panel p-4 md:p-8 rounded-[2rem] md:rounded-[4rem] border-4 border-[var(--brand-secondary)] shadow-[0_0_40px_rgba(0,240,255,0.3)] flex flex-col lg:flex-row items-center justify-center gap-6 md:gap-10 w-full max-w-5xl bg-gradient-to-br from-slate-900 to-slate-800 overflow-hidden">
                            
                            <div className="flex flex-col items-center bg-slate-800/80 p-4 md:p-8 rounded-[2rem] md:rounded-[3rem] border-2 border-[var(--brand-secondary)] shadow-inner w-full lg:w-auto">
                                <span className="text-sm md:text-xl font-black text-[var(--brand-secondary)] mb-4 md:mb-6 uppercase tracking-widest border-b-2 border-slate-500 pb-2 drop-shadow-md">Holograma Base</span>
                                <div className="flex flex-col items-center gap-4 md:gap-6 w-full">
                                    <FractionDisplay num={data.base.n} den={data.base.d} />
                                    <FractionGraphic n={data.base.n} d={data.base.d} theme="pizza" sizeClass="w-full max-w-[280px] h-12 md:h-20" />
                                </div>
                            </div>
                            
                            <div className="text-5xl md:text-7xl font-black text-[var(--brand-yellow)] drop-shadow-[0_0_15px_rgba(255,234,0,0.8)] animate-pulse shrink-0 rotate-90 lg:rotate-0">=</div>
                            
                            <div className="flex flex-col justify-center gap-3 md:gap-5 w-full lg:w-auto">
                                {data.options.map((opt, i) => (
                                    <div key={i} onClick={() => check(opt)}
                                         className="draggable-item bg-slate-800 p-3 md:p-4 rounded-xl md:rounded-[2rem] border-2 md:border-4 border-slate-500 flex flex-row items-center gap-4 md:gap-6 hover:border-[var(--brand-primary)] hover:bg-slate-700 shadow-xl group transition-all w-full lg:w-[350px]">
                                        <div className="bg-slate-900 px-3 py-2 md:px-6 md:py-3 rounded-lg md:rounded-xl text-xl md:text-3xl font-black text-white group-hover:text-[var(--brand-primary)] transition-colors min-w-[60px] md:min-w-[80px] text-center shrink-0">
                                            {opt.n}/{opt.d}
                                        </div>
                                        <FractionGraphic n={opt.n} d={opt.d} theme="default" sizeClass="w-full h-8 md:h-12" />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- BLOQUE 3: Multiplicar y Dividir ---
        const ActOperation = ({ data, onComplete, onError }) => {
            const [selected, setSelected] = useState(null);
            const [placed, setPlaced] = useState({ n: null, d: null });
            
            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const handleSelect = (num) => { playPop(); setSelected(num); };
            const onDragStart = (e, num) => { e.dataTransfer.setData('application/json', JSON.stringify({ num })); handleSelect(num); };
            const onDrop = (e, zone) => {
                e.preventDefault();
                try {
                    const d = JSON.parse(e.dataTransfer.getData('application/json'));
                    if (d && d.num !== undefined) { playPlace(); setPlaced(prev => ({...prev, [zone]: d.num})); setSelected(null); }
                } catch(err){}
            };

            const handleDropClick = (zone) => { if (selected !== null) { playPlace(); setPlaced({ ...placed, [zone]: selected }); setSelected(null); } };
            const handleRemove = (zone, e) => { e.stopPropagation(); playPop(); setPlaced({ ...placed, [zone]: null }); };

            const check = () => {
                if (placed.n === null || placed.d === null) { onError("¡Carga ambos números arrastrándolos a las cajas!", false); return; }
                if (placed.n === data.ansN && placed.d === data.ansD) onComplete();
                else onError(`Error de cálculo. Debes ${data.op === 'x' ? 'multiplicar' : 'dividir'} ambos números por ${data.factor}.`);
            };

            return (
                <div className="horizontal-layout">
                    <div className="robot-pane">
                        <RobotGuide text={`¡Motor de equivalencia! Selecciona y coloca los números para ${data.op === 'x' ? 'multiplicar' : 'dividir'} arriba y abajo.`} />
                        <Button onClick={check} variant="primary" className="mt-6 md:mt-12 w-full text-xl md:text-3xl py-4 md:py-6">Analizar</Button>
                    </div>
                    
                    <div className="interaction-pane">
                        <div className="flex flex-col gap-6 md:gap-8 w-full max-w-4xl">
                            <div className="glass-panel py-8 px-4 md:py-16 md:px-10 rounded-[2rem] md:rounded-[4rem] border-4 border-[var(--brand-primary)] flex flex-row items-center justify-center gap-4 md:gap-8 shadow-[0_0_50px_rgba(255,0,122,0.3)] bg-gradient-to-b from-slate-900 to-slate-800 scale-90 md:scale-100 origin-center">
                                
                                <FractionDisplay num={data.origN} den={data.origD} />
                                
                                <div className="flex flex-col items-center justify-between h-40 md:h-60 relative w-24 md:w-44 shrink-0">
                                    <div className="absolute -top-8 md:-top-12 flex flex-col items-center">
                                        <span className="text-[var(--brand-secondary)] font-black text-sm md:text-2xl bg-slate-900 px-3 py-1 md:px-6 md:py-2 rounded-full border-2 border-[var(--brand-secondary)] mb-1 md:mb-2 shadow-[0_0_15px_rgba(0,240,255,0.4)] whitespace-nowrap">
                                            {data.op === 'x' ? '×' : '÷'} {data.factor}
                                        </span>
                                        <svg width="100%" height="30" viewBox="0 0 120 40" className="overflow-visible w-20 md:w-[120px]">
                                            <path d="M 0,25 Q 60,-15 110,25" fill="transparent" stroke="var(--brand-secondary)" strokeWidth="5" />
                                            <polygon points="105,12 120,25 105,38" fill="var(--brand-secondary)" />
                                        </svg>
                                    </div>

                                    <div className="text-[var(--brand-yellow)] text-5xl md:text-7xl font-black m-auto drop-shadow-[0_0_15px_rgba(255,234,0,0.5)]">=</div>

                                    <div className="absolute -bottom-8 md:-bottom-12 flex flex-col items-center">
                                        <svg width="100%" height="30" viewBox="0 0 120 40" className="overflow-visible w-20 md:w-[120px]">
                                            <path d="M 0,15 Q 60,55 110,15" fill="transparent" stroke="var(--brand-secondary)" strokeWidth="5" />
                                            <polygon points="105,2 120,15 105,28" fill="var(--brand-secondary)" />
                                        </svg>
                                        <span className="text-[var(--brand-secondary)] font-black text-sm md:text-2xl bg-slate-900 px-3 py-1 md:px-6 md:py-2 rounded-full border-2 border-[var(--brand-secondary)] mt-1 md:mt-2 shadow-[0_0_15px_rgba(0,240,255,0.4)] whitespace-nowrap">
                                            {data.op === 'x' ? '×' : '÷'} {data.factor}
                                        </span>
                                    </div>
                                </div>
                                
                                <div className="flex flex-col items-center gap-2 md:gap-4 shrink-0">
                                    <div onDragOver={(e) => e.preventDefault()} onDrop={(e) => onDrop(e, 'n')} onClick={() => handleDropClick('n')} 
                                         className={`w-20 h-20 md:w-32 md:h-32 rounded-xl md:rounded-3xl dropzone border-2 md:border-4 border-dashed flex items-center justify-center ${selected && !placed.n ? 'active border-[var(--brand-yellow)]' : 'border-slate-500'} ${placed.n ? 'filled border-[var(--brand-yellow)] bg-[var(--brand-yellow)]/20' : ''}`}>
                                        {placed.n ? (
                                            <div onClick={(e) => handleRemove('n', e)} className="w-full h-full bg-[var(--brand-yellow)] text-slate-900 rounded-lg md:rounded-2xl flex items-center justify-center text-4xl md:text-7xl font-black pop-in cursor-pointer shadow-[0_0_20px_rgba(255,234,0,0.8)]">{placed.n}</div>
                                        ) : <span className="text-slate-400 font-bold text-xs md:text-xl animate-pulse text-center">Toca<br/>aquí</span>}
                                    </div>
                                    <div className="w-24 md:w-44 h-2 md:h-5 bg-white rounded-full shadow-[0_0_15px_rgba(255,255,255,0.8)]"></div>
                                    <div onDragOver={(e) => e.preventDefault()} onDrop={(e) => onDrop(e, 'd')} onClick={() => handleDropClick('d')} 
                                         className={`w-20 h-20 md:w-32 md:h-32 rounded-xl md:rounded-3xl dropzone border-2 md:border-4 border-dashed flex items-center justify-center ${selected && !placed.d ? 'active border-[var(--brand-yellow)]' : 'border-slate-500'} ${placed.d ? 'filled border-[var(--brand-yellow)] bg-[var(--brand-yellow)]/20' : ''}`}>
                                        {placed.d ? (
                                            <div onClick={(e) => handleRemove('d', e)} className="w-full h-full bg-[var(--brand-yellow)] text-slate-900 rounded-lg md:rounded-2xl flex items-center justify-center text-4xl md:text-7xl font-black pop-in cursor-pointer shadow-[0_0_20px_rgba(255,234,0,0.8)]">{placed.d}</div>
                                        ) : <span className="text-slate-400 font-bold text-xs md:text-xl animate-pulse text-center">Toca<br/>aquí</span>}
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-row flex-wrap justify-center gap-4 md:gap-6 bg-slate-800/90 p-4 md:p-8 rounded-[2rem] md:rounded-[3rem] border-4 border-slate-600 w-full shadow-2xl">
                                {data.pool.map((num, i) => (
                                    <div key={i} draggable onDragStart={(e) => onDragStart(e, num)} onClick={() => handleSelect(num)}
                                         className={`draggable-item w-16 h-16 md:w-28 md:h-28 text-3xl md:text-6xl font-black rounded-full flex items-center justify-center border-2 md:border-4 shadow-[0_6px_0_0_rgba(0,0,0,0.6)] ${
                                             selected === num ? 'pulse-glow bg-[var(--brand-yellow)] text-slate-900 border-white scale-110' : 'bg-slate-700 text-white border-slate-400'
                                         }`}
                                    >
                                        {num}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- BLOQUE 4: El Número Faltante ---
        const MiniArrow = ({ direction, op, factor, position }) => {
            const isR2L = direction === 'R2L';
            const isTop = position === 'top';
            
            return (
                <div className={`absolute left-1/2 -translate-x-1/2 flex flex-col items-center opacity-50 pointer-events-none z-10 transition-opacity duration-300 w-24 md:w-40 ${isTop ? 'bottom-full mb-6 md:mb-16' : 'top-full mt-6 md:mt-16'}`}>
                    <div className={`relative flex items-center justify-center w-full ${isR2L ? 'scale-x-[-1]' : ''} ${!isTop ? 'scale-y-[-1]' : ''}`}>
                        <svg width="100%" height="100%" viewBox="0 0 220 40" preserveAspectRatio="none" className="overflow-visible h-6 md:h-10">
                            <path d="M 10,35 Q 110,-10 210,35" fill="transparent" stroke="white" strokeWidth="3" strokeDasharray="8 8" />
                            <polygon points="190,25 215,35 190,45" fill="white" />
                        </svg>
                    </div>
                    <div className={`absolute left-1/2 -translate-x-1/2 ${isTop ? '-top-4 md:-top-6' : '-bottom-4 md:-bottom-6'}`}>
                        <span className="text-white text-[10px] md:text-sm font-black bg-slate-900/90 px-2 md:px-3 py-1 rounded-full border border-white/30 whitespace-nowrap tracking-widest drop-shadow-md">
                            {op} {factor}
                        </span>
                    </div>
                </div>
            )
        };

        const ActMissingTerm = ({ data, onComplete, onError }) => {
            const [selected, setSelected] = useState(null);
            const [placed, setPlaced] = useState(null);
            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const handleSelect = (num) => { playPop(); setSelected(num); };
            const onDragStart = (e, num) => { e.dataTransfer.setData('application/json', JSON.stringify({ num })); handleSelect(num); };
            const onDrop = (e) => { e.preventDefault(); try { const d = JSON.parse(e.dataTransfer.getData('application/json')); if (d && d.num !== undefined) { playPlace(); setPlaced(d.num); setSelected(null); } } catch(err){} };
            const handleDropClick = () => { if(selected !== null) { playPlace(); setPlaced(selected); setSelected(null); } };
            const handleRemove = (e) => { e.stopPropagation(); playPop(); setPlaced(null); };

            const check = () => {
                if (placed === null) { onError("¡Código incompleto! Selecciona un número.", false); return; }
                if (placed === data.missingValue) onComplete();
                else onError("Ese no es el número correcto. Recuerda la operación.");
            };

            const renderDropzone = () => (
                <div onDragOver={(e) => e.preventDefault()} onDrop={onDrop} onClick={handleDropClick} 
                    className={`w-20 h-20 md:w-36 md:h-36 rounded-2xl md:rounded-3xl dropzone border-2 md:border-4 border-dashed bg-slate-900 ${selected && !placed ? 'active border-[var(--brand-yellow)]' : 'border-slate-500'} ${placed ? 'filled border-none bg-transparent' : ''} flex justify-center items-center`}>
                    {placed ? (
                        <div onClick={handleRemove} className="w-full h-full bg-[var(--brand-yellow)] text-slate-900 rounded-2xl md:rounded-3xl flex items-center justify-center text-4xl md:text-7xl font-black pop-in shadow-[0_0_30px_rgba(255,234,0,0.8)] cursor-pointer">{placed}</div>
                    ) : <span className="text-[var(--brand-yellow)] text-3xl md:text-6xl font-black animate-pulse opacity-50">?</span>}
                </div>
            );

            const getHintDetails = () => {
                const isRightComplete = data.pos === 1 || data.pos === 2;
                const direction = isRightComplete ? 'R2L' : 'L2R';
                
                let knownComplete, knownIncomplete;
                if (data.pos === 1 || data.pos === 3) {
                    knownComplete = parseInt(isRightComplete ? data.d2 : data.d1);
                    knownIncomplete = parseInt(isRightComplete ? data.d1 : data.d2);
                } else {
                    knownComplete = parseInt(isRightComplete ? data.n2 : data.n1);
                    knownIncomplete = parseInt(isRightComplete ? data.n1 : data.n2);
                }
                
                const op = knownComplete < knownIncomplete ? '×' : '÷';
                const factor = knownComplete < knownIncomplete ? (knownIncomplete / knownComplete) : (knownComplete / knownIncomplete);
                
                return { direction, op, factor };
            };

            const { direction, op, factor } = getHintDetails();

            return (
                <div className="horizontal-layout relative">
                    <div className="robot-pane">
                        <RobotGuide text={`¡Rompecabezas activado! Encuentra el número que falta.`} />
                        <Button onClick={check} variant="primary" className="mt-6 md:mt-12 w-full text-xl md:text-3xl py-4 md:py-6">Verificar</Button>
                    </div>
                    
                    <div className="interaction-pane">
                        <div className="flex flex-col items-center w-full max-w-4xl gap-6 md:gap-8">
                            <div className="glass-panel p-8 md:p-16 rounded-[2rem] md:rounded-[4rem] border-4 md:border-8 border-[var(--brand-yellow)] shadow-[0_0_40px_rgba(255,234,0,0.4)] w-full flex flex-row justify-center items-center gap-6 md:gap-16 bg-gradient-to-t from-slate-900 to-slate-800 scale-90 md:scale-100 origin-center">
                                <div className="flex flex-col items-center gap-4 md:gap-6 z-20">
                                    {data.pos === 1 ? renderDropzone() : <span className="text-5xl md:text-8xl font-black text-white px-2 md:px-6 py-2 md:py-4 drop-shadow-lg">{data.n1}</span>}
                                    <div className="w-24 md:w-48 h-2 md:h-6 bg-[var(--brand-secondary)] rounded-full shadow-[0_0_20px_var(--brand-secondary)]"></div>
                                    {data.pos === 2 ? renderDropzone() : <span className="text-5xl md:text-8xl font-black text-white px-2 md:px-6 py-2 md:py-4 drop-shadow-lg">{data.d1}</span>}
                                </div>
                                
                                <div className="relative flex items-center justify-center mx-2 md:mx-8 shrink-0">
                                    {!placed && <MiniArrow direction={direction} op={op} factor={factor} position="top" />}
                                    <div className="text-5xl md:text-7xl font-black text-[var(--brand-yellow)] drop-shadow-[0_0_15px_rgba(255,234,0,0.8)] z-20">=</div>
                                    {!placed && <MiniArrow direction={direction} op={op} factor={factor} position="bottom" />}
                                </div>

                                <div className="flex flex-col items-center gap-4 md:gap-6 z-20">
                                    {data.pos === 3 ? renderDropzone() : <span className="text-5xl md:text-8xl font-black text-white px-2 md:px-6 py-2 md:py-4 drop-shadow-lg">{data.n2}</span>}
                                    <div className="w-24 md:w-48 h-2 md:h-6 bg-[var(--brand-secondary)] rounded-full shadow-[0_0_20px_var(--brand-secondary)]"></div>
                                    {data.pos === 4 ? renderDropzone() : <span className="text-5xl md:text-8xl font-black text-white px-2 md:px-6 py-2 md:py-4 drop-shadow-lg">{data.d2}</span>}
                                </div>
                            </div>

                            <div className="flex flex-row flex-wrap justify-center gap-4 md:gap-8 bg-slate-800/90 p-4 md:p-8 rounded-[2rem] md:rounded-[3rem] border-4 border-slate-600 w-full shadow-2xl">
                                {data.pool.map((num, i) => (
                                    <div key={i} draggable onDragStart={(e) => onDragStart(e, num)} onClick={() => handleSelect(num)}
                                         className={`draggable-item w-16 h-16 md:w-28 md:h-28 text-3xl md:text-6xl font-black rounded-full flex items-center justify-center border-2 md:border-4 shadow-[0_6px_0_0_rgba(0,0,0,0.6)] ${
                                             selected === num ? 'pulse-glow bg-[var(--brand-yellow)] text-slate-900 border-white scale-110' : 'bg-slate-700 text-white border-slate-400 hover:bg-slate-600'
                                         }`}>
                                        {num}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- BLOQUE 5: Pintar y Completar ---
        const ActPaintEquivalence = ({ data, onComplete, onError }) => {
            const [shaded, setShaded] = useState(new Set());
            const [selected, setSelected] = useState(null);
            const [placed, setPlaced] = useState(null);
            
            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const toggleShade = (idx) => { playPop(); const newSet = new Set(shaded); if (newSet.has(idx)) newSet.delete(idx); else newSet.add(idx); setShaded(newSet); };
            const handleSelect = (num) => { playPop(); setSelected(num); };
            const onDragStart = (e, num) => { e.dataTransfer.setData('num', num); handleSelect(num); };
            const onDrop = (e) => { e.preventDefault(); const val = e.dataTransfer.getData('num'); if(val) { playPlace(); setPlaced(Number(val)); setSelected(null); } };
            const handleDropClick = () => { if(selected !== null) { playPlace(); setPlaced(selected); setSelected(null); } };
            const handleRemove = (e) => { e.stopPropagation(); playPop(); setPlaced(null); };

            const check = () => {
                if (placed === null) { onError("¡Falta el número de control! Elige el numerador que corresponde.", false); return; }
                if (shaded.size !== data.correctN || placed !== data.correctN) { 
                    onError("¡La energía no está equilibrada! Verifica el número y las porciones pintadas."); 
                    return; 
                }
                onComplete();
            };

            return (
                <div className="horizontal-layout relative">
                    <div className="robot-pane">
                        <RobotGuide text={`1. Toca celdas grises para pintarlas de cian.\n2. Toca el número correcto para completar.`} />
                        <Button onClick={check} variant="primary" className="mt-6 md:mt-12 w-full text-xl md:text-3xl py-4 md:py-6">Comprobar</Button>
                    </div>
                    
                    <div className="interaction-pane">
                        <div className="flex flex-col items-center w-full max-w-4xl gap-6 md:gap-8">
                            <div className="glass-panel p-4 md:p-10 rounded-[2rem] md:rounded-[4rem] border-4 md:border-8 border-[var(--brand-secondary)] shadow-[0_0_40px_rgba(0,240,255,0.3)] w-full flex flex-col justify-center items-center gap-6 md:gap-12 bg-gradient-to-b from-slate-900 to-slate-800">
                                <div className="flex flex-col lg:flex-row items-center gap-6 md:gap-10 w-full justify-center">
