<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuProfe20 Lab fracciones equivalentes</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-primary: #FF007A; /* Magenta vivo */
            --brand-secondary: #00F0FF; /* Cian brillante */
            --brand-tertiary: #B000FF; /* Púrpura eléctrico */
            --brand-yellow: #FFEA00; /* Amarillo solar */
            --brand-green: #00FF66; /* Verde neón */
            --brand-orange: #FF5500; /* Naranja vibrante */
            --brand-bg: #0b061e;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--brand-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* FONDO ESPACIAL SÚPER DINÁMICO */
        .space-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10;
            /* Gradiente animado estilo nebulosa */
            background: linear-gradient(-45deg, #090a0f, #1a0b2e, #0f172a, #200030);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .milky-way {
            position: absolute; width: 200vw; height: 200vh; top: -50vh; left: -50vw;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 50px 160px, var(--brand-secondary), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 160px 120px, var(--brand-primary), rgba(0,0,0,0));
            background-repeat: repeat; background-size: 300px 300px;
            animation: rotateMilkyWay 250s linear infinite; opacity: 0.4;
        }

        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle linear infinite alternate; box-shadow: 0 0 10px #fff; }
        
        .floating-math { position: absolute; font-weight: 900; font-family: 'Nunito', sans-serif; opacity: 0.15; animation: floatMath linear infinite; user-select: none; pointer-events: none; }

        @keyframes rotateMilkyWay { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 15px #fff, 0 0 5px var(--brand-secondary); } }
        @keyframes floatMath { 0% { transform: translateY(110vh) rotate(0deg); } 100% { transform: translateY(-10vh) rotate(360deg); } }

        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .app-container { font-family: 'Nunito', sans-serif; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .bouncy-hover { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bouncy-hover:hover { transform: translateY(-8px) scale(1.05); }
        .bouncy-hover:active { transform: translateY(2px) scale(0.95); }
        
        .glass-panel { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 15px 50px 0 rgba(0, 0, 0, 0.6); }
        
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .float-anim { animation: floating 3s ease-in-out infinite; }
        .pulse-glow { animation: pulseGlow 1.5s infinite; }
        .wiggle { animation: wiggle 3s ease-in-out infinite; }
        .neon-text { text-shadow: 0 0 25px currentColor, 0 0 50px currentColor; }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 15px #fff; transform: scale(1.05); border-color: #fff; } 50% { box-shadow: 0 0 40px #fff; transform: scale(1.1); border-color: var(--brand-secondary); } }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg) translateY(0); } 25% { transform: rotate(-5deg) translateY(-10px); } 75% { transform: rotate(5deg) translateY(5px); } }

        .horizontal-layout { display: flex; flex-direction: row; align-items: center; justify-content: center; width: 100%; max-width: 1400px; height: 100%; padding: 2rem; gap: 4rem; margin: 0 auto; }
        .robot-pane { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        .interaction-pane { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; flex: 1; }

        .draggable-item { cursor: pointer; transition: all 0.3s ease; user-select: none; }
        .draggable-item:hover { transform: scale(1.1) translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .dropzone { transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(0,0,0,0.3); }
        .dropzone.active { border-color: var(--brand-green); background: rgba(0, 255, 102, 0.15); animation: pulseGlow 1.5s infinite; }
        .dropzone.filled { border-style: solid; border-color: var(--brand-yellow); background: rgba(255, 234, 0, 0.15); }

        .confetti-piece { position: absolute; width: 14px; height: 28px; opacity: 0; animation: fall linear forwards; }
        @keyframes fall { 0% { opacity: 1; top: -10%; transform: rotate(0deg); } 100% { opacity: 0; top: 110%; transform: rotate(720deg); } }

        .progress-track { height: 12px; background: rgba(255,255,255,.15); border-radius: 999px; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--brand-primary), var(--brand-yellow)); transition: width .5s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 20px var(--brand-primary); }
        .icon-button { width: 3.5rem; height: 3.5rem; border-radius: 1rem; display: grid; place-items: center; background: rgba(30,41,59,.9); border: 2px solid rgba(255,255,255,.2); transition: all 0.3s ease; }
        .icon-button:hover { background: var(--brand-primary); border-color: white; transform: scale(1.1) rotate(5deg); }
        
        /* Ocultar barra scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (max-width: 900px) {
            body { overflow: auto; }
            .app-container { min-height: 100dvh; height: auto; }
            .horizontal-layout { flex-direction: column; height: auto; min-height: 100%; padding: 1rem; gap: 1.25rem; overflow-y: auto; }
            .robot-pane { width: 100%; max-width: 560px; }
            .robot-pane svg { width: 86px; height: 86px; }
            .interaction-pane { width: 100%; gap: 1rem; }
            .interaction-pane > * { min-width: 0 !important; width: 100% !important; padding: 1.25rem !important; border-radius: 2rem !important; }
            .bouncy-hover:hover { transform: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Play = (p) => <IconBase {...p}><polygon points="5 3 19 12 5 21 5 3"/></IconBase>;
        const Star = (p) => <IconBase {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const AlertCircle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>;
        const Check = (p) => <IconBase {...p}><polyline points="20 6 9 17 4 12"/></IconBase>;
        const ArrowLeft = (p) => <IconBase {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconBase>;
        const Rocket = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path></svg>;

        const audioCtx = typeof window !== 'undefined' ? new (window.AudioContext || window.webkitAudioContext)() : null;
        const playTone = (freq, type, duration, vol = 0.1, sweep = false) => {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                if (sweep) {
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(freq / 2, audioCtx.currentTime + duration);
                } else {
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                }
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        };

        let soundEnabled = true;
        const soundLibrary = {
            pop: () => playTone(800, 'sine', 0.1, 0.1, true),
            click: () => playTone(1200, 'triangle', 0.05, 0.1),
            place: () => playTone(600, 'sine', 0.1, 0.2), 
            success: () => { playTone(523.25, 'sine', 0.1, 0.2); setTimeout(() => playTone(659.25, 'sine', 0.1, 0.2), 100); setTimeout(() => playTone(783.99, 'sine', 0.2, 0.2), 200); },
            wrong: () => { playTone(250, 'sawtooth', 0.2, 0.2, true); setTimeout(() => playTone(200, 'sawtooth', 0.3, 0.2, true), 150); },
            win: () => { [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.3, 0.2), i * 150)); }
        };
        const useSound = (soundKey) => useCallback(() => { if (soundEnabled && soundLibrary[soundKey]) soundLibrary[soundKey](); }, [soundKey]);

        // Componentes Generales y Fondo Dinámico
        const DynamicBackground = () => {
            const [stars, setStars] = useState([]);
            const [symbols, setSymbols] = useState([]);
            
            useEffect(() => {
                const s = Array.from({length: 120}).map((_, i) => ({
                    id: i, left: `${Math.random() * 100}vw`, top: `${Math.random() * 100}vh`,
                    size: `${Math.random() * 3 + 1}px`, animDuration: `${2 + Math.random() * 5}s`, animDelay: `-${Math.random() * 5}s`
                }));
                setStars(s);

                const mathSyms = ['½', '¾', '×', '÷', '+', '=', '¼'];
                const sym = Array.from({length: 15}).map((_, i) => ({
                    id: i, char: mathSyms[Math.floor(Math.random() * mathSyms.length)],
                    left: `${Math.random() * 100}vw`, fontSize: `${Math.random() * 60 + 40}px`,
                    animDuration: `${20 + Math.random() * 20}s`, animDelay: `-${Math.random() * 20}s`,
                    color: ['var(--brand-primary)', 'var(--brand-secondary)', 'var(--brand-yellow)'][Math.floor(Math.random() * 3)]
                }));
                setSymbols(sym);
            }, []);

            return (
                <div className="space-bg">
                    <div className="milky-way"></div>
                    {stars.map(s => <div key={`s-${s.id}`} className="star" style={{left: s.left, top: s.top, width: s.size, height: s.size, animationDuration: s.animDuration, animationDelay: s.animDelay}}></div>)}
                    {symbols.map(s => <div key={`sym-${s.id}`} className="floating-math" style={{left: s.left, fontSize: s.fontSize, color: s.color, animationDuration: s.animDuration, animationDelay: s.animDelay}}>{s.char}</div>)}
                </div>
            );
        };

        const AnimatedRobot = ({ size = 100, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 100 100" className={`overflow-visible float-anim ${className}`} xmlns="http://www.w3.org/2000/svg">
                <line x1="50" y1="25" x2="50" y2="10" stroke="#94A3B8" strokeWidth="4" strokeLinecap="round" />
                <circle cx="50" cy="8" r="6" fill="var(--brand-yellow)" className="animate-pulse" filter="drop-shadow(0 0 5px var(--brand-yellow))" />
                <rect x="15" y="25" width="70" height="55" rx="20" fill="#1E293B" stroke="var(--brand-secondary)" strokeWidth="4" filter="drop-shadow(0 0 10px var(--brand-secondary))" />
                <rect x="25" y="32" width="50" height="35" rx="12" fill="#0F172A" />
                <circle cx="37" cy="45" r="7" fill="var(--brand-primary)" />
                <circle cx="63" cy="45" r="7" fill="var(--brand-primary)" />
                <path d="M 40 58 Q 50 66 60 58" stroke="var(--brand-green)" strokeWidth="4" fill="none" strokeLinecap="round" filter="drop-shadow(0 0 5px var(--brand-green))" />
            </svg>
        );

        const RobotGuide = ({ text, children }) => (
            <div className="flex flex-col items-center gap-6 w-full relative z-20">
                <div className="relative bg-slate-900/80 backdrop-blur-md p-4 rounded-[3rem] border-4 border-[var(--brand-secondary)] shadow-[0_0_30px_rgba(0,240,255,0.6)] wiggle">
                    <AnimatedRobot size={150} />
                </div>
                <div className="glass-panel text-white p-6 rounded-3xl rounded-tl-none border-t-4 border-[var(--brand-tertiary)] font-bold text-xl relative pop-in text-center leading-relaxed w-full shadow-2xl flex flex-col items-center gap-4 bg-gradient-to-br from-slate-800 to-slate-900">
                    {text}
                    {children}
                    <div className="absolute -top-4 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[12px] border-l-transparent border-b-[18px] border-b-[var(--brand-tertiary)] border-r-[12px] border-r-transparent"></div>
                </div>
            </div>
        );

        const Button = ({ children, onClick, variant = 'primary', className = '' }) => {
            const playClick = useSound('click');
            const variants = { 
                primary: "bg-gradient-to-r from-[var(--brand-primary)] to-[var(--brand-tertiary)] shadow-[0_8px_0_0_#500099] hover:brightness-125 text-white border-2 border-white/30", 
                secondary: "bg-gradient-to-r from-[var(--brand-secondary)] to-[#0099ff] shadow-[0_8px_0_0_#005599] hover:brightness-125 text-white border-2 border-white/30" 
            };
            return <button type="button" onClick={(e) => { playClick(); if(onClick) onClick(e); }} className={`bouncy-hover font-black py-4 px-10 rounded-full text-2xl transition-all flex items-center justify-center gap-3 uppercase tracking-wider z-20 relative ${variants[variant]} ${className}`}>{children}</button>;
        };

        const FractionDisplay = ({ num, den }) => (
            <div className="flex flex-col items-center justify-center font-black text-white px-4">
                <span className="text-5xl md:text-6xl border-b-4 border-white pb-1 px-4 text-center min-w-[3ch] drop-shadow-md">{num}</span>
                <span className="text-5xl md:text-6xl pt-1 px-4 text-center min-w-[3ch] drop-shadow-md">{den}</span>
            </div>
        );

        const FractionGraphic = ({ n, d, theme = 'default' }) => {
            const wholes = Math.ceil(n / d) || 1;
            const getThemeColors = () => {
                if(theme === 'chocolate') return { bg: 'bg-[#3E2723]', fill: 'bg-[#5D4037]', border: 'border-[#1b100e]' };
                if(theme === 'pizza') return { bg: 'bg-orange-200', fill: 'bg-yellow-400', border: 'border-orange-500' };
                return { bg: 'bg-slate-800', fill: 'bg-[var(--brand-secondary)]', border: 'border-slate-500' };
            };
            const colors = getThemeColors();

            return (
                <div className="flex flex-wrap gap-4 justify-center items-center">
                    {Array.from({length: wholes}).map((_, wIdx) => (
                        <div key={wIdx} className={`flex border-4 ${colors.border} rounded-xl overflow-hidden ${colors.bg} shadow-[0_10px_20px_rgba(0,0,0,0.5)]`}>
                            {Array.from({length: d}).map((_, dIdx) => {
                                const isShaded = (wIdx * d) + dIdx < n;
                                return <div key={dIdx} className={`w-8 h-12 border-r-2 ${colors.border} last:border-r-0 ${isShaded ? colors.fill : ''} ${isShaded ? 'shadow-[inset_0_0_10px_rgba(255,255,255,0.4)]' : ''}`}></div>;
                            })}
                        </div>
                    ))}
                </div>
            );
        };

        const Confetti = () => {
            const [pieces, setPieces] = useState([]);
            useEffect(() => {
                const colors = ['#FF007A', '#00F0FF', '#FFE600', '#B000FF', '#00FF66'];
                setPieces(Array.from({ length: 100 }).map((_, i) => ({ id: i, left: `${Math.random() * 100}%`, animationDuration: `${Math.random() * 2 + 1}s`, animationDelay: `${Math.random() * 0.5}s`, backgroundColor: colors[Math.floor(Math.random() * colors.length)], transform: `rotate(${Math.random() * 360}deg)` })));
            }, []);
            return <div className="absolute inset-0 overflow-hidden pointer-events-none z-[100]">{pieces.map(p => <div key={p.id} className="confetti-piece rounded-sm" style={p} />)}</div>;
        };


        // --- BLOQUE 1: Rectas Numéricas Interactivas ---
        const ActNumberLineInteractive = ({ data, onComplete, onError }) => {
            const [markerPos, setMarkerPos] = useState(null);
            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const handleTickClick = (idx) => { playPlace(); setMarkerPos(idx); };
            const check = () => {
                if (markerPos === null) { onError("¡Toca una marca en la segunda recta para colocar tu láser!"); return; }
                if (markerPos === data.correctN) onComplete();
                else onError("¡Uy! Ese punto no es equivalente. Fíjate que deben estar alineados como un rayo láser.");
            };

            const maxVal = 1;
            const pos1 = (data.f1.n / data.f1.d) * 100;

            const NumberLineFixed = ({ frac }) => (
                <div className="w-full relative h-16 flex items-center mb-12">
                    <div className="absolute top-1/2 left-0 w-full h-2 bg-slate-500 rounded-full -translate-y-1/2"></div>
                    {Array.from({ length: frac.d + 1 }).map((_, i) => (
                        <div key={i} className="absolute top-1/2 w-1 h-8 bg-slate-300 -translate-y-1/2" style={{ left: `${(i / frac.d) * 100}%` }}>
                            <span className="absolute top-10 left-1/2 -translate-x-1/2 text-lg font-bold text-slate-300">{i}/{frac.d}</span>
                        </div>
                    ))}
                    <div className="absolute top-1/2 w-2 h-12 bg-[var(--brand-primary)] -translate-y-1/2 z-10 shadow-[0_0_15px_var(--brand-primary)]" style={{ left: `${pos1}%` }}>
                        <div className="absolute -top-14 left-1/2 -translate-x-1/2 bg-[var(--brand-primary)] text-white px-4 py-2 rounded-xl font-black text-2xl shadow-lg border-2 border-white/50">
                            {frac.n}/{frac.d}
                        </div>
                    </div>
                </div>
            );

            const NumberLineInteractive = ({ divisions }) => (
                <div className="w-full relative h-16 flex items-center mt-12 mb-8">
                    <div className="absolute top-1/2 left-0 w-full h-2 bg-slate-500 rounded-full -translate-y-1/2"></div>
                    {Array.from({ length: divisions + 1 }).map((_, i) => (
                        <div key={i} onClick={() => handleTickClick(i)} 
                             className="absolute top-1/2 w-8 h-16 bg-transparent cursor-pointer -translate-y-1/2 group flex justify-center items-center z-20" 
                             style={{ left: `${(i / divisions) * 100}%`, transform: 'translate(-50%, -50%)' }}>
                            <div className={`w-1 h-8 transition-colors ${markerPos === i ? 'bg-[var(--brand-yellow)] h-12' : 'bg-slate-300 group-hover:bg-white group-hover:h-12 shadow-[0_0_10px_rgba(255,255,255,0.5)]'}`}></div>
                            <span className="absolute top-[110%] left-1/2 -translate-x-1/2 text-lg font-bold text-slate-300">{i}/{divisions}</span>
                        </div>
                    ))}
                    {markerPos !== null && (
                        <div className="absolute top-1/2 w-2 h-12 bg-[var(--brand-yellow)] -translate-y-1/2 z-10 shadow-[0_0_25px_var(--brand-yellow)] pop-in pointer-events-none" 
                             style={{ left: `${(markerPos / divisions) * 100}%` }}>
                            <div className="absolute -top-14 left-1/2 -translate-x-1/2 bg-[var(--brand-yellow)] text-slate-900 px-4 py-2 rounded-xl font-black text-2xl shadow-lg border-2 border-white">
                                {markerPos}/{divisions}
                            </div>
                        </div>
                    )}
                </div>
            );

            return (
                <div className="horizontal-layout">
                    <div className="robot-pane">
                        <RobotGuide text="¡Encuentra el punto de salto hiperespacial! Haz clic en la marca de la recta de abajo que represente exactamente la misma cantidad." />
                        <Button onClick={check} variant="primary" className="mt-12 w-full text-3xl py-6">¡Activar Láser!</Button>
                    </div>
                    <div className="interaction-pane">
                        <div className="glass-panel p-10 rounded-[3rem] border-4 border-[var(--brand-tertiary)] shadow-[0_0_40px_rgba(176,0,255,0.3)] flex flex-col items-center justify-center gap-4 w-full min-w-[700px] bg-gradient-to-b from-slate-900/90 to-slate-800/90">
                            <div className="w-full px-12 relative py-8">

        // --- BLOQUE 2: Figuras Equivalentes ---
        const ActVisualEquivalence = ({ data, onComplete, onError }) => {
            const playPop = useSound('pop');
            const playPlace = useSound('place');
            
            const check = (opt) => {
                playPlace();
                if (opt.n === data.correct.n && opt.d === data.correct.d) onComplete();

                <div className="horizontal-layout">
                    <div className="robot-pane">

                        <div className="glass-panel p-12 rounded-[4rem] border-4 border-[var(--brand-secondary)] shadow-[0_0_40px_rgba(0,240,255,0.3)] flex flex-col items-center justify-center gap-10 w-full min-w-[600px] bg-gradient-to-br from-slate-900 to-slate-800">
                            
                            <div className="flex flex-col items-center bg-slate-800/80 p-6 rounded-[3rem] w-full border-2 border-[var(--brand-secondary)] shadow-inner">

                                <div className="flex flex-row items-center justify-center gap-12 w-full">
                                    <FractionDisplay num={data.base.n} den={data.base.d} />
                                    <div className="scale-125 transform">
                                        <FractionGraphic n={data.base.n} d={data.base.d} theme="pizza" />
                                    </div>
                                </div>
                            </div>
                            
                            <div className="text-5xl font-black text-[var(--brand-yellow)] drop-shadow-[0_0_10px_rgba(255,234,0,0.8)] animate-pulse">=</div>
                            
                            <div className="flex flex-row flex-wrap justify-center gap-8 w-full">
                                {data.options.map((opt, i) => (
                                    <div key={i} onClick={() => check(opt)}
                                         className="draggable-item bg-slate-800 p-6 rounded-[2rem] border-4 border-slate-500 flex flex-row items-center justify-center gap-6 hover:border-[var(--brand-primary)] hover:bg-slate-700 shadow-xl group transition-all">
                                        <div className="bg-slate-900 px-4 py-2 rounded-xl text-3xl font-black text-white group-hover:text-[var(--brand-primary)] transition-colors">
                                            {opt.n}/{opt.d}
                                        </div>

                                            <FractionGraphic n={opt.n} d={opt.d} theme="default" />

                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- BLOQUE 3: Multiplicar y Dividir ---
        const ActOperation = ({ data, onComplete, onError }) => {
            const [selected, setSelected] = useState(null);
            const [placed, setPlaced] = useState({ n: null, d: null });
            
            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const handleSelect = (num) => { playPop(); setSelected(num); };
            const onDragStart = (e, num) => { e.dataTransfer.setData('application/json', JSON.stringify({ num })); handleSelect(num); };
            const onDrop = (e, zone) => {
                e.preventDefault();
                try {
                    const d = JSON.parse(e.dataTransfer.getData('application/json'));
                    if (d && d.num !== undefined) { playPlace(); setPlaced(prev => ({...prev, [zone]: d.num})); setSelected(null); }
                } catch(err){}
            };

            const handleDropClick = (zone) => { if (selected !== null) { playPlace(); setPlaced({ ...placed, [zone]: selected }); setSelected(null); } };
            const handleRemove = (zone, e) => { e.stopPropagation(); playPop(); setPlaced({ ...placed, [zone]: null }); };

            const check = () => {
                if (placed.n === null || placed.d === null) { onError("¡Carga ambos números arrastrándolos a las cajas!"); return; }
                if (placed.n === data.ansN && placed.d === data.ansD) onComplete();
                else onError(`Error de cálculo. Debes ${data.op === 'x' ? 'multiplicar' : 'dividir'} ambos números por ${data.factor}.`);
            };

            return (
                <div className="horizontal-layout">
                    <div className="robot-pane">
                        <RobotGuide text={`¡Motor de equivalencia! Arrastra los números para ${data.op === 'x' ? 'multiplicar' : 'dividir'} arriba y abajo por el mismo factor.`} />

                    <div className="interaction-pane">

                                        <svg width="120" height="40" viewBox="0 0 120 40" className="overflow-visible">
                                            <path d="M 0,25 Q 60,-15 110,25" fill="transparent" stroke="var(--brand-secondary)" strokeWidth="5" />
                                            <polygon points="105,12 120,25 105,38" fill="var(--brand-secondary)" />
                                        </svg>
                                    </div>

                                    <div className="text-[var(--brand-yellow)] text-7xl font-black m-auto drop-shadow-[0_0_15px_rgba(255,234,0,0.5)]">=</div>

                                        <svg width="120" height="40" viewBox="0 0 120 40" className="overflow-visible">
                                            <path d="M 0,15 Q 60,55 110,15" fill="transparent" stroke="var(--brand-secondary)" strokeWidth="5" />
                                            <polygon points="105,2 120,15 105,28" fill="var(--brand-secondary)" />
                                        </svg>
                                        <span className="text-[var(--brand-secondary)] font-black text-2xl bg-slate-900 px-6 py-2 rounded-full border-2 border-[var(--brand-secondary)] mt-2 shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                                            {data.op === 'x' ? '×' : '÷'} {data.factor}

                                    </div>

                                    <div onDragOver={(e) => e.preventDefault()} onDrop={(e) => onDrop(e, 'd')} onClick={() => handleDropClick('d')} 
                                         className={`w-32 h-32 rounded-3xl dropzone border-4 border-dashed flex items-center justify-center ${selected && !placed.d ? 'active border-[var(--brand-yellow)]' : 'border-slate-500'} ${placed.d ? 'filled border-[var(--brand-yellow)] bg-[var(--brand-yellow)]/20' : ''}`}>
                                        {placed.d ? (
                                            <div onClick={(e) => handleRemove('d', e)} className="w-full h-full bg-[var(--brand-yellow)] text-slate-900 rounded-2xl flex items-center justify-center text-7xl font-black pop-in cursor-pointer shadow-[0_0_20px_rgba(255,234,0,0.8)]">{placed.d}</div>
                                        ) : <span className="text-slate-400 font-bold text-xl animate-pulse">Arrastra</span>}
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-row flex-wrap justify-center gap-6 bg-slate-800/90 p-8 rounded-[3rem] border-4 border-slate-600 w-full shadow-2xl">
                                {data.pool.map((num, i) => (
                                    <div key={i} draggable onDragStart={(e) => onDragStart(e, num)} onClick={() => handleSelect(num)}
                                         className={`draggable-item w-28 h-28 text-6xl font-black rounded-full flex items-center justify-center border-4 shadow-[0_8px_0_0_rgba(0,0,0,0.6)] ${
                                             selected === num ? 'pulse-glow bg-[var(--brand-yellow)] text-slate-900 border-white scale-110' : 'bg-slate-700 text-white border-slate-400'
                                         }`}
                                    >
                                        {num}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- BLOQUE 4: El Número Faltante ---
        const ActMissingTerm = ({ data, onComplete, onError }) => {
            const [selected, setSelected] = useState(null);
            const [placed, setPlaced] = useState(null);
            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const handleSelect = (num) => { playPop(); setSelected(num); };
            const onDragStart = (e, num) => { e.dataTransfer.setData('application/json', JSON.stringify({ num })); handleSelect(num); };
            const onDrop = (e) => { e.preventDefault(); try { const d = JSON.parse(e.dataTransfer.getData('application/json')); if (d && d.num !== undefined) { playPlace(); setPlaced(d.num); setSelected(null); } } catch(err){} };
            const handleDropClick = () => { if(selected !== null) { playPlace(); setPlaced(selected); setSelected(null); } };
            const handleRemove = (e) => { e.stopPropagation(); playPop(); setPlaced(null); };

            const check = () => {
                if (placed === null) { onError("¡Código incompleto! Arrastra un número a la caja vacía."); return; }
                if (placed === data.missingValue) onComplete();
                else onError("Ese no es el número. Tip Jedi: ¡Multiplica en forma de X (aspa), los resultados deben ser iguales!");
            };

            const renderDropzone = () => (
                <div onDragOver={(e) => e.preventDefault()} onDrop={onDrop} onClick={handleDropClick} 
                    className={`w-36 h-36 rounded-3xl dropzone border-4 border-dashed bg-slate-900 ${selected && !placed ? 'active border-[var(--brand-yellow)]' : 'border-slate-500'} ${placed ? 'filled border-none bg-transparent' : ''} flex justify-center items-center`}>
                    {placed ? (
                        <div onClick={handleRemove} className="w-full h-full bg-[var(--brand-yellow)] text-slate-900 rounded-3xl flex items-center justify-center text-7xl font-black pop-in shadow-[0_0_40px_rgba(255,234,0,0.8)] cursor-pointer">{placed}</div>
                    ) : <span className="text-[var(--brand-yellow)] text-6xl font-black animate-pulse opacity-50">?</span>}
                </div>
            );

            return (
                <div className="horizontal-layout relative">
                    <div className="robot-pane">
                        <RobotGuide text={`¡Rompecabezas activado! Encuentra el número que falta para que el valor de las fracciones sea idéntico.`} />
                        <Button onClick={check} variant="primary" className="mt-12 w-full text-3xl py-6">Verificar</Button>
                    </div>
                    
                    <div className="interaction-pane">
                        <div className="flex flex-col items-center w-full min-w-[650px] gap-8">
                            <div className="glass-panel p-16 rounded-[4rem] border-8 border-[var(--brand-yellow)] shadow-[0_0_60px_rgba(255,234,0,0.4)] w-full flex justify-center items-center gap-16 bg-gradient-to-t from-slate-900 to-slate-800">
                                <div className="flex flex-col items-center gap-6">
                                    {data.pos === 1 ? renderDropzone() : <span className="text-8xl font-black text-white px-6 py-4 drop-shadow-lg">{data.n1}</span>}
                                    <div className="w-48 h-6 bg-[var(--brand-secondary)] rounded-full shadow-[0_0_20px_var(--brand-secondary)]"></div>
                                    {data.pos === 2 ? renderDropzone() : <span className="text-8xl font-black text-white px-6 py-4 drop-shadow-lg">{data.d1}</span>}
                                </div>
                                <div className="text-7xl font-black text-[var(--brand-yellow)] mx-4 drop-shadow-[0_0_15px_rgba(255,234,0,0.8)]">=</div>
                                <div className="flex flex-col items-center gap-6">
                                    {data.pos === 3 ? renderDropzone() : <span className="text-8xl font-black text-white px-6 py-4 drop-shadow-lg">{data.n2}</span>}
                                    <div className="w-48 h-6 bg-[var(--brand-secondary)] rounded-full shadow-[0_0_20px_var(--brand-secondary)]"></div>
                                    {data.pos === 4 ? renderDropzone() : <span className="text-8xl font-black text-white px-6 py-4 drop-shadow-lg">{data.d2}</span>}
                                </div>
                            </div>

                            <div className="flex flex-row flex-wrap justify-center gap-8 bg-slate-800/90 p-8 rounded-[3rem] border-4 border-slate-600 w-full shadow-2xl">
                                {data.pool.map((num, i) => (
                                    <div key={i} draggable onDragStart={(e) => onDragStart(e, num)} onClick={() => handleSelect(num)}
                                         className={`draggable-item w-28 h-28 text-6xl font-black rounded-full flex items-center justify-center border-4 shadow-[0_8px_0_0_rgba(0,0,0,0.6)] ${
                                             selected === num ? 'pulse-glow bg-[var(--brand-yellow)] text-slate-900 border-white scale-110' : 'bg-slate-700 text-white border-slate-400 hover:bg-slate-600'
                                         } ${placed === num ? 'opacity-20 grayscale pointer-events-none' : ''}`}>
                                        {num}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- BLOQUE 5: Pintar y Completar ---
        const ActPaintEquivalence = ({ data, onComplete, onError }) => {
            const [shaded, setShaded] = useState(new Set());
            const [selected, setSelected] = useState(null);
            const [placed, setPlaced] = useState(null);
            
            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const toggleShade = (idx) => { playPop(); const newSet = new Set(shaded); if (newSet.has(idx)) newSet.delete(idx); else newSet.add(idx); setShaded(newSet); };
            const handleSelect = (num) => { playPop(); setSelected(num); };
            const onDragStart = (e, num) => { e.dataTransfer.setData('num', num); handleSelect(num); };
            const onDrop = (e) => { e.preventDefault(); const val = e.dataTransfer.getData('num'); if(val) { playPlace(); setPlaced(Number(val)); setSelected(null); } };
            const handleDropClick = () => { if(selected !== null) { playPlace(); setPlaced(selected); setSelected(null); } };
            const handleRemove = (e) => { e.stopPropagation(); playPop(); setPlaced(null); };

            const check = () => {
                if (shaded.size !== data.correctN) { onError(`¡Pinta exactamente ${data.correctN} porciones en la nave derecha para que la energía sea equivalente!`); return; }
                if (placed === null) { onError("¡Falta el número de control! Arrastra el numerador que corresponde."); return; }
                if (placed !== data.correctN) { onError("El número que colocaste no coincide con las partes que pintaste."); return; }
                onComplete();
            };

            return (
                <div className="horizontal-layout relative">
                    <div className="robot-pane">
                        <RobotGuide text={`1. Haz clic en las celdas grises para pintarlas de energía cian.\n2. Arrastra el número correcto para completar tu panel.`} />
                        <Button onClick={check} variant="primary" className="mt-12 w-full text-3xl py-6">Comprobar</Button>
                    </div>
                    
                    <div className="interaction-pane">
                        <div className="flex flex-col items-center w-full min-w-[750px] gap-8">
                            <div className="glass-panel p-10 rounded-[4rem] border-8 border-[var(--brand-secondary)] shadow-[0_0_60px_rgba(0,240,255,0.3)] w-full flex flex-col justify-center items-center gap-12 bg-gradient-to-b from-slate-900 to-slate-800">
                                <div className="flex flex-row items-center gap-10 w-full justify-center">
                                    <div className="flex flex-col items-center gap-4 bg-slate-800/80 p-8 rounded-[3rem] border-2 border-slate-600 shadow-inner">
                                        <span className="text-xl font-black text-slate-400 tracking-widest uppercase mb-2 drop-shadow-md">Nave Base</span>
                                        <div className="flex flex-row items-center gap-10">
                                            <FractionDisplay num={data.f1.n} den={data.f1.d} />
                                            <div className="scale-125 transform"><FractionGraphic n={data.f1.n} d={data.f1.d} theme="pizza" /></div>
                                        </div>
                                    </div>
                                    
                                    <div className="text-7xl font-black text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.6)]">=</div>
                                    
                                    <div className="flex flex-col items-center gap-4 bg-slate-800/80 p-8 rounded-[3rem] border-2 border-[var(--brand-secondary)] relative shadow-[0_0_30px_rgba(0,240,255,0.2)]">
                                        <div className="absolute -top-6 animate-bounce z-10 whitespace-nowrap">
                                            <span className="text-sm font-black text-slate-900 bg-[var(--brand-green)] tracking-widest uppercase px-6 py-2 rounded-full shadow-[0_0_20px_rgba(0,255,102,0.9)]">¡Pinta aquí!</span>
                                        </div>
                                        <span className="text-xl font-black text-[var(--brand-secondary)] tracking-widest uppercase mb-2 drop-shadow-md">Nave Gemela</span>
                                        <div className="flex flex-row items-center gap-10">
                                            <div className="flex flex-col items-center justify-center font-black text-white px-4">
                                                <div onDragOver={e=>e.preventDefault()} onDrop={onDrop} onClick={handleDropClick} className={`w-28 h-28 mb-2 rounded-2xl dropzone border-4 border-dashed flex items-center justify-center bg-slate-900 ${selected && !placed ? 'active border-[var(--brand-yellow)]' : 'border-slate-500'} ${placed ? 'filled border-[var(--brand-yellow)] bg-[var(--brand-yellow)]/20' : ''}`}>
                                                    {placed ? (
                                                        <div onClick={handleRemove} className="w-full h-full bg-[var(--brand-yellow)] text-slate-900 rounded-xl flex items-center justify-center text-7xl font-black pop-in cursor-pointer shadow-[0_0_25px_rgba(255,234,0,0.8)]">{placed}</div>
                                                    ) : <span className="text-[var(--brand-yellow)] text-sm font-black text-center opacity-70">Arrastrar<br/>aquí</span>}
                                                </div>
                                                <div className="w-32 h-4 bg-white rounded-full shadow-md"></div>
                                                <span className="text-7xl pt-2">{data.f2.d}</span>
                                            </div>
                                            <div className="scale-125 transform">
                                                <div className="flex border-4 border-[var(--brand-secondary)] rounded-xl overflow-hidden bg-slate-900 shadow-[0_0_30px_rgba(0,240,255,0.5)]">
                                                    {Array.from({length: data.f2.d}).map((_, idx) => (
                                                        <div key={idx} onClick={() => toggleShade(idx)} 
                                                             className={`w-8 h-14 border-r-2 border-slate-700 last:border-r-0 cursor-pointer transition-colors hover:bg-white/40 ${shaded.has(idx) ? 'bg-[var(--brand-secondary)] shadow-[inset_0_0_20px_rgba(255,255,255,0.8)]' : ''}`}>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-row flex-wrap justify-center gap-8 bg-slate-800/90 p-8 rounded-[3rem] border-4 border-slate-600 w-full shadow-2xl">
                                {data.pool.map((num, i) => (
                                    <div key={i} draggable onDragStart={(e)=>onDragStart(e, num)} onClick={() => handleSelect(num)}
                                         className={`draggable-item w-28 h-28 text-6xl font-black rounded-full flex items-center justify-center border-4 shadow-[0_8px_0_0_rgba(0,0,0,0.6)] ${
                                             selected === num ? 'pulse-glow bg-[var(--brand-yellow)] text-slate-900 border-white scale-110' : 'bg-slate-700 text-white border-slate-400 hover:bg-slate-600'
                                         } ${placed === num ? 'opacity-20 grayscale pointer-events-none' : ''}`}>
                                        {num}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- BLOQUE 6: Problemas Cotidianos ---
        const ActWordProblem = ({ data, onComplete, onError }) => {
            const [selected, setSelected] = useState(null);
            const [placed, setPlaced] = useState({});
            const [answers, setAnswers] = useState({});

            const playPop = useSound('pop');
            const playPlace = useSound('place');

            const handleSelect = (num) => { playPop(); setSelected(num); };
            const onDragStart = (e, num) => { e.dataTransfer.setData('num', num); handleSelect(num); };
            const onDrop = (e, idx) => { e.preventDefault(); const val = e.dataTransfer.getData('num'); if(val) { playPlace(); setPlaced(prev => ({...prev, [idx]: Number(val)})); setSelected(null); } };
            const handleDropClick = (idx) => { if(selected !== null) { playPlace(); setPlaced(prev => ({...prev, [idx]: selected})); setSelected(null); } };
            const handleRemove = (idx, e) => { e.stopPropagation(); playPop(); setPlaced(prev => { const newP = {...prev}; delete newP[idx]; return newP; }); };

            const handleAnswer = (qIdx, opt) => { playPop(); setAnswers(prev => ({...prev, [qIdx]: opt})); };

            const check = () => {
                for (let i = 0; i < data.fractions.length; i++) {
                    if (!data.fractions[i].static) {
                        if (placed[i] == null) { onError("¡Alerta! Convierte todas las fracciones al mismo denominador arrastrando los números."); return; }
                        if (placed[i] !== data.fractions[i].targetN) { onError(`Error en ${data.fractions[i].name}. Recuerda multiplicar numerador por el mismo factor que el denominador.`); return; }
                    }
                }
                for (let i = 0; i < data.questions.length; i++) {
                    if (!answers[i]) { onError("Analiza los resultados y responde todas las preguntas del reporte."); return; }
                    if (answers[i] !== data.questions[i].answer) { onError(`Tu respuesta a la pregunta "${data.questions[i].text}" es incorrecta. ¡Observa las conversiones!`); return; }
                }
                onComplete();
            };

            return (
                <div className="horizontal-layout relative">

            const [currentBlock, setCurrentBlock] = useState(0);
            const [currentLevel, setCurrentLevel] = useState(0);
            const [completedBlocks, setCompletedBlocks] = useState([]);
            const [showCheck, setShowCheck] = useState(false);
            const [errorMsg, setErrorMsg] = useState("");
            const [soundOn, setSoundOn] = useState(() => localStorage.getItem('tuprofe20-sound') !== 'off');
            
            const playClick = useSound('click');
            const playError = useSound('wrong');

            const totalScore = completedBlocks.length * 100 + (view === 'playing' ? currentLevel * 20 : 0);

            useEffect(() => {
                const saved = localStorage.getItem('tuprofe20-progress-final');
                if (saved) { try { setCompletedBlocks(JSON.parse(saved)); } catch (_) {} }
            }, []);
            useEffect(() => { soundEnabled = soundOn; localStorage.setItem('tuprofe20-sound', soundOn ? 'on' : 'off'); }, [soundOn]);
            useEffect(() => { localStorage.setItem('tuprofe20-progress-final', JSON.stringify(completedBlocks)); }, [completedBlocks]);
            useEffect(() => {
                const onKey = (event) => { if (event.key === 'Escape' && view === 'playing') setView('hub'); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [view]);

            const handleStart = () => { playClick(); setView('hub'); };
            const handleSelectBlock = (blockIndex) => { playClick(); setCurrentBlock(blockIndex); setCurrentLevel(0); setView('playing'); };
            
            const handleSuccess = () => { setShowCheck(true); setErrorMsg(""); };
            const handleError = (msg) => { playError(); setErrorMsg(msg); setTimeout(() => setErrorMsg(""), 5500); };

            const handleNext = () => { 
                setShowCheck(false);
                if (currentLevel < 4) {
                    setCurrentLevel(l => l + 1); 
                } 
                else {
                    if (!completedBlocks.includes(currentBlock)) setCompletedBlocks([...completedBlocks, currentBlock]);
                    setView('hub');
                }
            };

            const renderCurrentActivity = () => {
                const mission = missionsData[currentBlock][currentLevel];
                const props = { data: mission, onComplete: handleSuccess, onError: handleError };

                switch (mission.type) {
                    case 'number_line_interactive': return <ActNumberLineInteractive key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'visual': return <ActVisualEquivalence key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'paint': return <ActPaintEquivalence key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'operation': return <ActOperation key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'missing_term': return <ActMissingTerm key={`${currentBlock}-${currentLevel}`} {...props} />;
                    case 'word_problem': return <ActWordProblem key={`${currentBlock}-${currentLevel}`} {...props} />;

                }

                            <div className="flex items-center gap-4 md:gap-6">
                            <button type="button" onClick={() => { playClick(); setSoundOn(v => !v); }} className="icon-button bouncy-hover text-3xl shadow-lg bg-slate-800" aria-label={soundOn ? 'Silenciar sonidos' : 'Activar sonidos'} title={soundOn ? 'Silenciar' : 'Activar sonido'}>{soundOn ? '🔊' : '🔇'}</button>
                            <div className="flex items-center gap-4 bg-gradient-to-r from-slate-900 to-slate-800 px-6 py-3 rounded-full border-4 border-[var(--brand-yellow)] shadow-[0_0_20px_rgba(255,234,0,0.4)]">
                                <Star size={40} className="text-[var(--brand-yellow)] fill-[var(--brand-yellow)] animate-pulse drop-shadow-[0_0_10px_rgba(255,234,0,0.8)]" />
                                <span className="font-black text-[var(--brand-yellow)] text-2xl md:text-4xl drop-shadow-md">{totalScore} PTS</span>
                            </div>
                            </div>
                        </div>
                    )}

                    {errorMsg && (
                        <div className="absolute top-32 left-1/2 -translate-x-1/2 bg-gradient-to-r from-[var(--brand-primary)] to-[#cc0055] text-white px-12 py-6 rounded-3xl font-black text-3xl shadow-[0_20px_60px_rgba(255,0,122,0.9)] z-[300] flex items-center gap-6 pop-in border-4 border-white text-center">
                            <AlertCircle size={50} className="shrink-0 animate-pulse" strokeWidth={3} />
                            {errorMsg}
                        </div>
                    )}

                    <div className="flex-grow relative overflow-hidden flex items-center justify-center w-full z-10">
                        {view === 'start' && (
                            <div className="flex flex-col lg:flex-row items-center justify-center gap-12 lg:gap-24 glass-panel p-10 md:p-16 lg:p-24 rounded-[4rem] lg:rounded-[5rem] border-4 border-white/20 shadow-[0_0_120px_rgba(0,0,0,0.8)] pop-in w-11/12 max-w-[1400px] h-auto min-h-[75vh] my-6 bg-gradient-to-br from-slate-900/90 to-slate-800/90">
                                
                                <div className="flex flex-col items-center justify-center relative wiggle">
                                    <AnimatedRobot size={320} className="drop-shadow-[0_0_60px_rgba(0,240,255,0.8)] z-10" />
                                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-gradient-to-r from-[var(--brand-secondary)] to-[var(--brand-tertiary)] rounded-full blur-[100px] opacity-30 -z-10"></div>
                                </div>

                                <div className="flex flex-col items-center justify-center lg:border-l-4 border-white/20 lg:pl-24 text-center">
                                    <h1 className="text-6xl md:text-8xl lg:text-[110px] font-black text-white leading-tight tracking-tighter neon-text uppercase text-center drop-shadow-[0_0_20px_rgba(255,0,122,0.8)]">
                                        Aventura de<br/>
                                        <span className="text-[var(--brand-secondary)] text-7xl md:text-9xl lg:text-[130px] drop-shadow-[0_0_40px_rgba(0,240,255,0.8)]">Fracciones</span>
                                    </h1>
                                    
                                    <div className="bg-gradient-to-r from-[var(--brand-yellow)] to-[#ffaa00] border-4 border-white rounded-[2rem] px-16 py-6 mt-10 mb-14 shadow-[0_0_40px_rgba(255,234,0,0.6)] transform -rotate-3 hover:rotate-0 transition-transform">
                                        <p className="text-3xl md:text-5xl font-black text-slate-900 tracking-widest uppercase m-0 drop-shadow-sm text-center leading-tight">
                                            ¡Hola Explorador!
                                        </p>
                                    </div>
                                    
                                    <Button onClick={handleStart} variant="primary" className="text-5xl md:text-6xl px-24 py-10 shadow-[0_0_80px_rgba(255,0,122,0.8)] group border-4 border-white">
                                        ¡INICIAR! <Rocket size={60} className="group-hover:translate-x-4 group-hover:-translate-y-4 transition-transform" />
                                    </Button>
                                </div>
                            </div>
                        )}
                        
                        {view === 'hub' && <MissionHub onSelectBlock={handleSelectBlock} completedBlocks={completedBlocks} />}
                        {view === 'playing' && renderCurrentActivity()}
                    </div>

                    <SuccessModal isVisible={showCheck} onNext={handleNext} isBlockComplete={currentLevel === 4} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TuProfe20LabV2 />);
    </script>
</body>
</html>
